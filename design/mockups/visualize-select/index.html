<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시각화 패널 · 영역 선택 시안</title>
<script type="application/json" id="mx-tweaks">[
  {"id":"accent","label":"선택 색","type":"color","var":"--sel","default":"#ff3b6b"},
  {"id":"pin","label":"핀 크기","type":"range","var":"--pin","min":16,"max":26,"step":2,"unit":"px","default":20}
]</script>
<style>
  :root {
    --bg: #1a1a1c;
    --panel: #222225;
    --chrome: #1d1d20;
    --text: #e9e9e9;
    --muted: #a8a8a8;
    --border: rgba(255,255,255,.125);
    --accent: #5bb0ff;
    --sel: #ff3b6b;
    --pin: 20px;
    --old-hover: #2f6feb;
    --old-pin: #ff3b6b;
    --r-sm: 3px; --r-md: 6px; --r-lg: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  header { max-width: 1480px; margin: 0 auto; padding: 28px 24px 8px; }
  header h1 { margin: 0 0 6px; font-size: 20px; font-weight: 650; }
  header p { margin: 0; color: var(--muted); max-width: 78ch; }
  main {
    max-width: 1480px; margin: 0 auto; padding: 16px 24px 48px;
    display: grid; gap: 28px 24px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
  }
  figure { margin: 0; min-width: 0; }
  figcaption { margin-bottom: 10px; }
  figcaption b { display: block; font-size: 15px; font-weight: 650; }
  figcaption b .tag-now { color: var(--old-pin); font-weight: 600; font-size: 12px; margin-left: 6px; }
  figcaption b .tag-new { color: var(--accent); font-weight: 600; font-size: 12px; margin-left: 6px; }
  figcaption span { color: var(--muted); font-size: 13px; }

  /* Panel chrome (mirrors the side panel: tab chip + inline toolbar) */
  .panel {
    border: 1px solid var(--border); border-radius: var(--r-lg);
    background: var(--panel); overflow: hidden; max-width: 480px;
  }
  .chrome {
    display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 8px;
    background: var(--chrome); border-bottom: 1px solid var(--border);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border-radius: var(--r-md); background: rgba(255,255,255,.07); font-size: 13px;
  }
  .chip svg { color: var(--muted); }
  .tools { margin-left: auto; display: flex; gap: 2px; }
  .tool {
    width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r-md);
    color: var(--muted); border: 0; background: transparent; position: relative;
  }
  .tool[aria-pressed="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tool .badge {
    position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 7px; background: var(--accent); color: #0b1a2a; font: 700 10px/14px system-ui;
  }

  .viewport { position: relative; height: 392px; overflow: hidden; background: #f6f6f4; }
  .viewport.crosshair { cursor: crosshair; }

  /* Sample page rendered inside the panel (sample content) */
  .sp { padding: 22px 22px 0; color: #1f2328; font-size: 13px; }
  .sp-title { margin: 0; font-size: 18px; font-weight: 700; }
  .sp-sub { margin: 2px 0 14px; color: #59636e; }
  .sp-card { background: #fff; border: 1px solid #e3e3e0; border-radius: 10px; }
  .sp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #ededea; }
  .sp-row b { display: block; font-weight: 600; }
  .sp-row span { color: #59636e; font-size: 12px; }
  .sw { flex: none; width: 34px; height: 20px; border-radius: 10px; background: #cfd4da; position: relative; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .sw.on { background: #1f883d; }
  .sw.on::after { left: 16px; }
  .sp-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; }
  .sp-hint { color: #59636e; font-size: 12px; }
  .sp-btn { border: 0; border-radius: 6px; background: #1f883d; color: #fff; font: 600 13px/1 inherit; padding: 9px 16px; }

  /* Overlays: positioned by script from data-on */
  .ov { position: absolute; pointer-events: none; border-radius: var(--r-sm); }
  .old-hover { border: 2px dashed var(--old-hover); background: rgba(47,111,235,.08); }
  .old-pin { border: 2px solid var(--old-pin); box-shadow: 0 0 0 1px rgba(255,255,255,.75); }
  .old-num, .num {
    position: absolute; left: -9px; top: -9px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; color: #fff; text-align: center; font: 700 11px/18px system-ui;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .old-num { background: var(--old-pin); }
  .hover { outline: 1.5px solid var(--sel); outline-offset: 1px; background: color-mix(in srgb, var(--sel) 10%, transparent); }
  .sel { outline: 2px solid var(--sel); outline-offset: 1px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--sel) 22%, transparent); }
  .pinned { outline: 1.5px solid var(--sel); outline-offset: 1px; box-shadow: 0 0 0 1px rgba(255,255,255,.55); }
  .marquee { border: 1.5px dashed var(--sel); background: color-mix(in srgb, var(--sel) 9%, transparent); }
  .num {
    min-width: var(--pin); height: var(--pin); line-height: var(--pin); border-radius: calc(var(--pin) / 2);
    left: calc(var(--pin) / -2); top: calc(var(--pin) / -2);
    background: var(--sel); color: #fff; border: 2px solid #fff;
    line-height: calc(var(--pin) - 4px); font-size: 11px;
  }
  .label {
    position: absolute; left: -1px; top: calc(100% + 6px); white-space: nowrap;
    padding: 3px 8px; border-radius: var(--r-md); background: #18181b; color: #f2f2f2;
    font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .label em { font-style: normal; color: #a8a8a8; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .label kbd, .hint kbd, .card kbd {
    font: 600 11px/1 system-ui; padding: 2px 5px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06);
  }

  /* Mode hint bar (proposal) */
  .hint {
    display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px 0 10px;
    background: color-mix(in srgb, var(--sel) 10%, var(--chrome)); color: #e9e9e9;
    border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .hint .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sel); flex: none; }
  .hint .grow { flex: 1; min-width: 0; display: flex; gap: 10px; flex-wrap: wrap; color: #cfcfcf; }
  .hint .count { color: #a8a8a8; font-variant-numeric: tabular-nums; }
  .hint button { border: 0; background: transparent; color: #cfcfcf; font: inherit; padding: 2px 6px; border-radius: 4px; }

  /* Comment cards */
  .card, .old-note {
    position: absolute; z-index: 4; color: var(--text);
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  .old-note { width: 240px; padding: 8px; border-radius: 8px; }
  .old-note .lbl { margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  .old-note .ta, .card .ta {
    min-height: 56px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--r-md);
    color: var(--muted); font-size: 13px;
  }
  .card .ta.filled { color: var(--text); }
  .row { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 8px; }
  .btn { padding: 4px 10px; border-radius: var(--r-md); border: 1px solid var(--border); background: transparent; color: inherit; font: 12px/1.5 inherit; }
  .btn.primary { border-color: transparent; background: var(--accent); color: #0b1a2a; font-weight: 600; }
  .btn.primary.dim { opacity: .5; }
  .card { width: 288px; padding: 10px; border-radius: var(--r-lg); }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card .head .n { flex: none; width: 20px; height: 20px; border-radius: 10px; background: var(--sel); color: #fff; font: 700 11px/20px system-ui; text-align: center; }
  .card .head b { font-size: 13px; font-weight: 600; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .crumbs span { padding: 1px 6px; border-radius: 4px; }
  .crumbs span.on { color: var(--text); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .crumbs i { font-style: normal; opacity: .5; }
  .row .keys { margin-right: auto; color: var(--muted); font-size: 11px; }

  .card .head .del { margin-left: auto; border: 0; background: transparent; color: var(--muted); font: 12px/1.5 inherit; padding: 2px 6px; border-radius: 4px; }

  /* Chat composer with pin chips (mirrors .visualize-feedback-chip) */
  .composer { margin-top: 10px; max-width: 480px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--panel); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 0; }
  .fchip {
    display: inline-flex; align-items: center; gap: 4px; max-width: 220px; min-width: 0;
    padding: 2px 4px 2px 3px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; line-height: 18px;
  }
  .fchip .n { flex: none; width: 18px; height: 18px; border-radius: 9px; background: var(--sel); color: #fff; font: 700 10px/18px system-ui; text-align: center; }
  .fchip .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fchip .x { flex: none; color: var(--muted); padding: 0 3px; }
  .compose-input { padding: 8px 12px 10px; color: var(--muted); font-size: 14px; }

  .vid { position: absolute; inset: 0; background: #0e0f12; }
  .vid-frame { position: absolute; left: 0; right: 0; top: 0; height: 248px; background: #14161b; overflow: hidden; }
  .vid-sun { position: absolute; left: 60px; top: 70px; width: 90px; height: 90px; border-radius: 50%; background: #3a5b7a; }
  .vid-sub { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 4px 10px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; white-space: nowrap; }
  .vid-card { position: absolute; right: 48px; top: 58px; width: 170px; height: 96px; border-radius: 8px; background: #24384d; }
  .vid-bar { position: absolute; left: 0; right: 0; top: 248px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #18191d; color: #e9e9e9; font-size: 12px; font-variant-numeric: tabular-nums; }
  .vid-track { position: relative; flex: 1; height: 4px; border-radius: 2px; background: #3a3b40; }
  .vid-track i { position: absolute; left: 0; top: 0; bottom: 0; width: 40%; border-radius: 2px; background: #e9e9e9; }
  .vid-track b { position: absolute; left: 40%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; }
  .vid-track em { position: absolute; left: 40%; top: -20px; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 8px; background: var(--sel); color: #fff; font: 700 10px/16px system-ui; font-style: normal; text-align: center; }

  .note { margin-top: 10px; font-size: 13px; color: var(--muted); max-width: 480px; }
  .note b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>시각화 패널 · 영역 선택(코멘트) 최종안</h1>
  <p>A는 지금 코드(<code>VisualizeFeedback.tsx</code>, <code>visualize-feedback.ts</code>)의 실제 값으로 다시 그린 현재 모습이고, B–E가 최종안입니다. 마우스 올림·선택·핀은 모두 분홍 계열로 통일했습니다(파랑은 시안 선택지 표시와 겹치기 때문). 패널 안의 "알림 설정" 화면은 예시 데이터입니다. 참고: Claude Design의 요소별 인라인 코멘트, cherry-studio의 클릭+드래그 겸용 선택, orca의 마우스 아래 요소 이름표·핀 목록.</p>
</header>

<main>
  <!-- A: current -->
  <figure>
    <figcaption>
      <b>A · 지금 <span class="tag-now">현재</span></b>
      <span>"저장" 버튼을 누르려 해도 안쪽 글자(span)만 잡히고, 메모 제목은 CSS 선택자, 핀은 테마와 상관없는 분홍입니다. HTML은 드래그가 안 되고 PDF·이미지는 클릭이 안 됩니다.</span>
    </figcaption>
    <div class="panel">
      <div class="chrome" data-chrome="pressed"></div>
      <div class="viewport crosshair">
        <div class="sp-host"></div>
        <div class="ov old-pin" data-on="title"><span class="old-num">1</span></div>
        <div class="ov old-hover" data-on="btnlabel"></div>
        <div class="old-note" data-anchor="btnlabel" data-place="above" data-align="right">
          <div class="lbl">span</div>
          <div class="ta">Comment on this element…</div>
          <div class="row"><button class="btn" type="button">Cancel</button><button class="btn primary dim" type="button">Add</button></div>
        </div>
      </div>
    </div>
  </figure>

  <!-- B: enter + hover -->
  <figure>
    <figcaption>
      <b>B · 코멘트 모드 진입과 마우스 올리기 <span class="tag-new">제안</span></b>
      <span>상단 안내줄이 할 수 있는 동작과 종료 방법을 알려주고, 마우스 아래 요소에는 사람이 읽는 이름표(종류 · 글자 · 크기)가 붙습니다.</span>
    </figcaption>
    <div class="panel">
      <div class="chrome" data-chrome="pressed"></div>
      <div class="hint" data-count="0"></div>
      <div class="viewport crosshair">
        <div class="sp-host"></div>
        <div class="ov hover" data-on="row1"><span class="label">설정 행 · 이메일 알림<em>392×58</em></span></div>
      </div>
    </div>
  </figure>

  <!-- C: select + comment -->
  <figure>
    <figcaption>
      <b>C · 선택하고 코멘트 달기 <span class="tag-new">제안</span></b>
      <span>클릭하면 요소 바로 옆에 코멘트 카드가 붙습니다. 상위 경로를 눌러 잡힌 범위를 넓히거나 좁힐 수 있어 글자만 잡히는 문제가 사라집니다.</span>
    </figcaption>
    <div class="panel">
      <div class="chrome" data-chrome="pressed"></div>
      <div class="hint" data-count="0"></div>
      <div class="viewport crosshair">
        <div class="sp-host"></div>
        <div class="ov sel" data-on="btn"><span class="num">1</span></div>
        <div class="card" data-anchor="btn" data-place="above" data-align="right">
          <div class="head"><span class="n">1</span><b>버튼 · 저장</b></div>
          <div class="crumbs"><span>카드</span><i>›</i><span>하단 영역</span><i>›</i><span class="on">버튼</span><i>›</i><span>글자</span></div>
          <div class="ta filled">저장 버튼을 오른쪽 끝에 붙이고 조금 더 크게</div>
          <div class="row"><span class="keys"><kbd>Enter</kbd> 추가 · <kbd>Esc</kbd> 취소</span><button class="btn" type="button">취소</button><button class="btn primary" type="button">추가</button></div>
        </div>
      </div>
    </div>
  </figure>

  <!-- D: region drag -->
  <figure>
    <figcaption>
      <b>D · 드래그로 영역 지정 <span class="tag-new">제안</span></b>
      <span>HTML에서도 드래그로 여러 요소를 한 번에 묶습니다. Office(PDF로 변환해 표시)·PDF·이미지, 그리고 새로 지원하는 Mermaid·SVG·Markdown도 같은 드래그, 같은 카드를 씁니다.</span>
    </figcaption>
    <div class="panel">
      <div class="chrome" data-chrome="pressed"></div>
      <div class="hint" data-count="1"></div>
      <div class="viewport crosshair">
        <div class="sp-host"></div>
        <div class="ov marquee" data-on="row1,row2" data-pad="4"><span class="num">2</span></div>
        <div class="card" data-anchor="row1,row2" data-place="below">
          <div class="head"><span class="n">2</span><b>영역 · 설정 행 2개</b></div>
          <div class="ta filled">두 행 사이 간격을 줄이고 설명 글자를 한 단계 작게</div>
          <div class="row"><span class="keys"><kbd>Enter</kbd> 추가</span><button class="btn" type="button">취소</button><button class="btn primary" type="button">추가</button></div>
        </div>
      </div>
    </div>
  </figure>

  <!-- E: pins + tray -->
  <figure>
    <figcaption>
      <b>E · 핀 여러 개 <span class="tag-new">제안</span></b>
      <span>핀을 누르면 그 코멘트 카드가 다시 열려 고치거나 지웁니다. 목록은 패널에 따로 두지 않고, 보낼 자리인 입력창 위 카드로만 보여줍니다(<code>composer-chips.html</code>).</span>
    </figcaption>
    <div class="panel">
      <div class="chrome" data-chrome="pressed" data-badge="3"></div>
      <div class="hint" data-count="3"></div>
      <div class="viewport crosshair">
        <div class="sp-host"></div>
        <div class="ov pinned" data-on="title"><span class="num">1</span></div>
        <div class="ov sel" data-on="row1,row2" data-pad="4"><span class="num">2</span></div>
        <div class="ov pinned" data-on="btn"><span class="num">3</span></div>
        <div class="card" data-anchor="row1,row2" data-place="below">
          <div class="head"><span class="n">2</span><b>영역 · 설정 행 2개</b><button class="del" type="button">삭제</button></div>
          <div class="ta filled">두 행 사이 간격을 줄이고 설명 글자를 한 단계 작게</div>
          <div class="row"><span class="keys"><kbd>Enter</kbd> 저장</span><button class="btn" type="button">취소</button><button class="btn primary" type="button">저장</button></div>
        </div>
      </div>
    </div>
  </figure>

  <!-- F: video frame -->
  <figure>
    <figcaption>
      <b>F · 영상 장면에 핀 달기 <span class="tag-new">새로 지원</span></b>
      <span>코멘트 모드를 켜면 영상이 멈추고, 멈춘 장면 위에서 드래그합니다. 핀에는 시각(0:12)이 함께 남고, 재생 막대에도 번호가 찍혀 그 장면으로 돌아갈 수 있습니다.</span>
    </figcaption>
    <div class="panel">
      <div class="chrome" data-chrome="pressed"></div>
      <div class="hint" data-count="0" data-variant="video"></div>
      <div class="viewport crosshair">
        <div class="vid">
          <div class="vid-frame"><span class="vid-sun"></span><span class="vid-card"></span><span class="vid-sub" data-k="sub">오늘의 일정을 정리해 볼게요</span></div>
          <div class="vid-bar"><span>▶</span><span>0:12</span><span class="vid-track"><i></i><b></b><em>1</em></span><span>0:30</span></div>
        </div>
        <div class="ov marquee" data-on="sub" data-pad="8"><span class="num">1</span></div>
        <div class="card" data-anchor="sub" data-place="above" data-offset="0">
          <div class="head"><span class="n">1</span><b>영상 0:12 · 영역</b></div>
          <div class="ta filled">자막을 화면 위쪽으로 올리고 배경을 빼줘</div>
          <div class="row"><span class="keys"><kbd>Enter</kbd> 추가</span><button class="btn" type="button">취소</button><button class="btn primary" type="button">추가</button></div>
        </div>
      </div>
    </div>
  </figure>

</main>

<template id="sample">
  <div class="sp">
    <h3 class="sp-title" data-k="title">알림 설정</h3>
    <p class="sp-sub">받을 알림을 고르세요.</p>
    <div class="sp-card" data-k="card">
      <div class="sp-row" data-k="row1"><div><b>이메일 알림</b><span>주간 요약을 메일로 받습니다</span></div><i class="sw on"></i></div>
      <div class="sp-row" data-k="row2"><div><b>푸시 알림</b><span>멘션과 답글만 받습니다</span></div><i class="sw"></i></div>
      <div class="sp-foot" data-k="foot"><span class="sp-hint">변경 사항은 저장해야 적용됩니다</span><button class="sp-btn" type="button" data-k="btn"><span data-k="btnlabel">저장</span></button></div>
    </div>
  </div>
</template>

<script>
(function () {
  var icons = {
    eye: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    comment: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg>',
    tree: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h6M3 12h6M3 19h6M14 5h7M14 12h7M14 19h7"/></svg>',
    more: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>'
  };
  document.querySelectorAll('[data-chrome]').forEach(function (bar) {
    var badge = bar.getAttribute('data-badge');
    bar.innerHTML =
      '<span class="chip">' + icons.eye + '알림 설정 시안</span>' +
      '<span class="tools">' +
        '<button class="tool" type="button" aria-label="코멘트" aria-pressed="true">' + icons.comment + (badge ? '<span class="badge">' + badge + '</span>' : '') + '</button>' +
        '<button class="tool" type="button" aria-label="요소 목록">' + icons.tree + '</button>' +
        '<button class="tool" type="button" aria-label="더 보기">' + icons.more + '</button>' +
      '</span>';
  });

  document.querySelectorAll('.hint[data-count]').forEach(function (bar) {
    bar.innerHTML =
      '<span class="dot"></span>' +
      (bar.getAttribute('data-variant') === 'video'
        ? '<span class="grow"><span>드래그 영역</span><span><kbd>Space</kbd> 재생/멈춤</span><span><kbd>←</kbd><kbd>→</kbd> 장면 이동</span></span>'
        : '<span class="grow"><span>클릭 요소</span><span>드래그 영역</span><span><kbd>Alt</kbd>+<kbd>↑</kbd> 상위 요소</span></span>') +
      '<span class="count">핀 ' + bar.getAttribute('data-count') + '/20</span>' +
      '<button type="button"><kbd>Esc</kbd> 끝내기</button>';
  });

  var tpl = document.getElementById('sample');
  document.querySelectorAll('.sp-host').forEach(function (host) {
    host.appendChild(tpl.content.cloneNode(true));
  });

  function union(view, keys) {
    var base = view.getBoundingClientRect();
    var box = null;
    keys.split(',').forEach(function (key) {
      var el = view.querySelector('[data-k="' + key.trim() + '"]');
      if (!el) return;
      var r = el.getBoundingClientRect();
      var b = { l: r.left - base.left, t: r.top - base.top, r: r.right - base.left, b: r.bottom - base.top };
      box = box ? { l: Math.min(box.l, b.l), t: Math.min(box.t, b.t), r: Math.max(box.r, b.r), b: Math.max(box.b, b.b) } : b;
    });
    return { box: box, width: base.width, height: base.height };
  }

  function layout() {
    document.querySelectorAll('.viewport').forEach(function (view) {
      view.querySelectorAll('[data-on]').forEach(function (ov) {
        var u = union(view, ov.getAttribute('data-on'));
        if (!u.box) return;
        var pad = Number(ov.getAttribute('data-pad') || 0);
        ov.style.left = (u.box.l - pad) + 'px';
        ov.style.top = (u.box.t - pad) + 'px';
        ov.style.width = (u.box.r - u.box.l + pad * 2) + 'px';
        ov.style.height = (u.box.b - u.box.t + pad * 2) + 'px';
      });
      view.querySelectorAll('[data-anchor]').forEach(function (card) {
        var u = union(view, card.getAttribute('data-anchor'));
        if (!u.box) return;
        var w = card.offsetWidth, h = card.offsetHeight;
        var offset = Number(card.getAttribute('data-offset') || 0);
        var place = card.getAttribute('data-place') || 'below';
        var top = place === 'above' ? u.box.t - h - 10 : u.box.b + 10 + offset;
        var left = card.getAttribute('data-align') === 'right' ? u.box.r - w : u.box.l;
        card.style.left = Math.max(8, Math.min(left, u.width - w - 8)) + 'px';
        card.style.top = Math.max(8, Math.min(top, u.height - h - 8)) + 'px';
      });
    });
  }
  layout();
  addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
