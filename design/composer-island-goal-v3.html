<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer island · Goal segment v3</title>
<style>
  /* Tokens: dark = composer-island-final.html; light = 01-tokens.css light theme */
  :root, [data-theme="dark"] {
    --page: #0f0f11; --bg: #161618; --text: #e9e9e9; --soft: #d6d6d6; --muted: #a8a8a8; --faint: #7a7a80;
    --accent: #79b8ff; --warn: #f2cf76; --ok: #6bd586; --danger: #f17471;
    --line: rgba(255,255,255,.08); --island: #232326; --track: #3d3d41; --hover: rgba(255,255,255,.08);
    --sep: rgba(255,255,255,.09); --code: #19191c; --btn-line: rgba(255,255,255,.12);
    --pill-shadow: 0 2px 4px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.3), 0 0 0 .5px rgba(255,255,255,.16), 0 -.5px 0 rgba(255,255,255,.06), 0 12px 24px -4px rgba(0,0,0,.22);
    --panel-shadow: 0 0 0 1px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.06), 0 6px 18px rgba(0,0,0,.22);
  }
  [data-theme="light"] {
    --page: #e8e8e8; --bg: #fcfcfc; --text: #222222; --soft: rgba(34,34,34,.85); --muted: #606060; --faint: #606060;
    --accent: #185abc; --warn: #855900; --ok: #137333; --danger: #b82d35;
    --line: rgba(0,0,0,.09); --island: #ffffff; --track: #dadada; --hover: rgba(119,119,119,.12);
    --sep: rgba(0,0,0,.12); --code: #f3f3f3; --btn-line: rgba(0,0,0,.16);
    --pill-shadow: 0 1px 2px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.18), 0 8px 18px -6px rgba(0,0,0,.16);
    --panel-shadow: 0 0 0 1px rgba(0,0,0,.1), 0 6px 18px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 400 14px/20px "Pretendard Variable", Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; padding: 32px 40px 80px; }
  main { max-width: 1880px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  h2 { font-size: 15px; font-weight: 600; margin: 48px 0 6px; }
  h2 em { font-style: normal; color: var(--ok); font-weight: 500; }
  .lead { color: var(--muted); font-size: 13px; margin: 0 0 12px; max-width: 980px; }
  .tools { position: absolute; right: 40px; top: 28px; display: flex; gap: 6px; }
  .tools button { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 0; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--btn-line); padding: 3px 10px; cursor: pointer; }
  .tools button[aria-pressed="true"] { color: var(--text); background: var(--hover); }

  /* ── island pill (same language as composer-island-final) ── */
  .pill { display: inline-flex; align-items: center; height: 34px; padding: 0 4px; border-radius: 999px; background: var(--island); box-shadow: var(--pill-shadow);
    font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: -.005em; white-space: nowrap; max-width: 100%; min-width: 0; }
  .seg { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 999px; color: var(--soft); font-variant-numeric: tabular-nums; flex: none; }
  .seg + .seg { margin-left: 5px; }
  .seg + .seg::before { content: ""; position: absolute; left: -3px; top: 50%; width: 1px; height: 14px; transform: translateY(-50%); background: var(--sep); }
  .meta { color: var(--muted); font-weight: 400; }
  .w { color: var(--warn); }
  .pulse, .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .pulse { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  .dot.warn { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .seg > svg.bot { color: var(--muted); }

  /* ── goal segment ── */
  .seg.goal { color: var(--text); min-width: 0; flex: 0 1 auto; overflow: hidden; cursor: default; --c: var(--accent); --cf: var(--accent); }
  .seg.goal:hover { background: var(--hover); }
  .seg.goal[data-s="paused"]   { --c: var(--muted); --cf: var(--muted); }
  .seg.goal[data-s="blocked"]  { --c: var(--danger); }
  .seg.goal[data-s="waiting"]  { --c: var(--warn); }
  .seg.goal[data-s="complete"] { --c: var(--ok); --cf: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .seg.goal[data-s="complete"]:hover { background: color-mix(in srgb, var(--ok) 20%, transparent); }
  .gl { color: var(--c); }
  .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; max-width: var(--tm, 240px); flex: 0 1 auto; }
  .goal .title.flex { flex: 1 1 0; max-width: none; }
  .sec { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-weight: 400; display: inline-flex; gap: 6px; }
  .sec .st { color: var(--c); font-weight: 500; flex: none; }
  .sec .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .goal[data-s="paused"] .st { color: var(--muted); }
  .sec.fade, .sec.fade .tx { text-overflow: clip; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); }
  .chev { color: var(--faint); font-weight: 400; flex: none; opacity: .8; }
  .cnt { flex: none; }
  .tm { flex: none; color: var(--muted); font-weight: 400; min-width: 3ch; text-align: right; }
  .st-label { color: var(--c); flex: none; }
  .goal[data-s="paused"] .st-label { color: var(--muted); }
  .t-dim { color: var(--muted); font-weight: 400; }

  /* pips: one per task */
  .pips { display: flex; gap: 2px; width: 56px; height: 4px; flex: none; }
  .pips.many { gap: 1px; }
  .pips i { flex: 1 1 0; border-radius: 2px; background: var(--track); }
  .pips i.c { background: var(--cf); }
  .pips i.i { background: linear-gradient(90deg, var(--c) 50%, var(--track) 50%); }
  .pips i.a { background: var(--warn); }
  .pips i.d { align-self: center; height: 2px; opacity: .7; }
  /* ring */
  .ring { position: relative; width: 18px; height: 18px; flex: none; display: grid; place-items: center; color: var(--c); }
  .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--c) var(--p), var(--track) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
  .ring svg { width: 10px; height: 10px; stroke-width: 2.6; }
  .ring svg { width: 11px; height: 11px; stroke-width: 2.2; }
  .ring.fxr { color: var(--soft); }
  .gl.fx { position: relative; display: inline-flex; }
  .gl.fx svg { color: var(--soft); }
  .gl.fx .sd { position: absolute; right: -3px; bottom: -2px; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--island); }
  .gl.fx + .pips { margin-left: 2px; }
  .icrow { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 8px 4px; }
  .icrow + .icrow { border-top: 1px solid var(--line); }
  .iclab { width: 150px; font-size: 12.5px; color: var(--muted); }
  .iclab b { display: block; color: var(--text); font-weight: 500; }
  .zoomwrap { display: flex; gap: 28px; flex-wrap: wrap; }
  .zoom { position: relative; background: var(--bg); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px 18px 14px; overflow: hidden; }
  .zoom small { display: block; color: var(--faint); font-size: 11px; margin-bottom: 10px; }
  .zoom .z { zoom: 2.6; display: inline-block; position: relative; }
  .zoom .z::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: color-mix(in srgb, var(--danger) 55%, transparent); pointer-events: none; }
  .ring .core { width: 4px; height: 4px; border-radius: 50%; background: var(--c); }
  /* baseline progress (direction B) */
  .base { position: absolute; left: 12px; right: 12px; bottom: 1px; height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--track) 70%, transparent); overflow: hidden; }
  .base i { display: block; height: 100%; width: var(--p); background: var(--cf); border-radius: 2px; }
  .goal[data-s="blocked"] .base i, .goal[data-s="waiting"] .base i { background: var(--accent); }
  /* current (shipped) */
  .bar { width: 22px; height: 3px; border-radius: 99px; background: var(--track); overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; background: var(--accent); }

  /* ── layout of the matrix ── */
  .grid { display: grid; grid-template-columns: 112px 360px 560px 760px; gap: 10px; align-items: stretch; overflow-x: auto; padding-bottom: 4px; }
  .hd { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .rl { font-size: 12.5px; color: var(--muted); padding-top: 10px; }
  .rl b { display: block; color: var(--text); font-weight: 500; }
  .cell { background: var(--bg); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); padding: 6px 10px 10px; display: grid; gap: 6px; align-content: start; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .stage small { align-self: flex-start; font-size: 10.5px; color: var(--faint); line-height: 14px; }
  .stage .row { width: 100%; display: flex; justify-content: center; }
  .dirhead { display: flex; align-items: baseline; gap: 10px; }
  .why { color: var(--soft); font-size: 13px; max-width: 980px; margin: 0 0 12px; }
  .why b { color: var(--text); font-weight: 600; }

  /* ── compare ── */
  .cmp { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 10px; max-width: 1180px; }
  .cmp .cell { padding: 10px 12px 12px; }

  /* ── panel (expanded) – same as final mockup .panel ── */
  .panels { display: grid; grid-template-columns: repeat(auto-fill, 560px); gap: 22px; }
  .shot { background: var(--bg); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); padding: 12px; width: 584px; }
  .shot > small { display: block; color: var(--faint); font-size: 11px; margin-bottom: 8px; }
  .shot .pillrow { display: flex; justify-content: center; margin-bottom: 8px; }
  .panel { width: 560px; max-width: 100%; border-radius: 18px; background: var(--island); box-shadow: var(--panel-shadow); font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; }
  .phead { height: 42px; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .tab { height: 26px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 999px; color: var(--text); background: var(--hover); font-variant-numeric: tabular-nums; --c: var(--accent); --cf: var(--accent); }
  .tab[data-s="paused"] { --c: var(--muted); --cf: var(--muted); } .tab[data-s="blocked"] { --c: var(--danger); } .tab[data-s="waiting"] { --c: var(--warn); } .tab[data-s="complete"] { --c: var(--ok); --cf: var(--ok); }
  .tab .st { color: var(--c); font-weight: 500; }
  .x { margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; color: var(--muted); }
  .pbody { padding: 12px 14px 12px; display: grid; gap: 10px; }
  .obj { margin: 0; font-size: 14px; line-height: 20px; color: var(--text); font-weight: 500; }
  .sline { display: flex; gap: 6px; align-items: center; color: var(--muted); font-weight: 400; font-size: 12.5px; line-height: 18px; font-variant-numeric: tabular-nums; --c: var(--accent); }
  .sline[data-s="paused"] { --c: var(--muted); } .sline[data-s="blocked"] { --c: var(--danger); } .sline[data-s="waiting"] { --c: var(--warn); } .sline[data-s="complete"] { --c: var(--ok); }
  .sline .st { color: var(--c); font-weight: 500; }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  ul.tasks li { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 8px; margin: 0 -8px; border-radius: 9px; font-weight: 400; color: var(--soft); }
  ul.tasks li + li { margin-top: 1px; }
  ul.tasks li svg { color: var(--faint); }
  ul.tasks li .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.tasks li[data-k="c"] { color: var(--muted); } ul.tasks li[data-k="c"] svg { color: var(--ok); }
  ul.tasks li[data-k="i"] { color: var(--text); font-weight: 500; background: var(--hover); } ul.tasks li[data-k="i"] svg { color: var(--accent); }
  ul.tasks li[data-k="n"] svg { color: var(--faint); }
  ul.tasks li[data-k="d"] { color: var(--faint); } ul.tasks li[data-k="d"] .tt { text-decoration: line-through; text-decoration-thickness: 1px; }
  ul.tasks li[data-k="a"] { color: var(--text); font-weight: 500; background: color-mix(in srgb, var(--warn) 12%, transparent); } ul.tasks li[data-k="a"] svg { color: var(--warn); }
  ul.tasks li[data-k="x"] { color: var(--text); font-weight: 500; background: color-mix(in srgb, var(--danger) 10%, transparent); } ul.tasks li[data-k="x"] svg { color: var(--danger); }
  .chip { font-size: 11px; height: 18px; padding: 0 7px; border-radius: 999px; display: inline-flex; align-items: center; font-weight: 400; flex: none; }
  .chip.w { color: var(--warn); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); }
  .chip.r { color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent); }
  .blk { margin: 0; font-size: 12.5px; line-height: 18px; font-weight: 400; color: var(--warn); }
  .ctrl { display: flex; justify-content: flex-end; gap: 6px; border-top: 1px solid var(--line); padding: 10px 14px; }
  .btn { height: 24px; padding: 0 10px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--btn-line); display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; color: var(--soft); }
  .pbody.done { padding-bottom: 14px; }

  /* tooltip sample + legend */
  .tip { width: 300px; border-radius: 12px; background: var(--island); box-shadow: var(--panel-shadow); padding: 10px 12px; font-size: 12.5px; line-height: 18px; font-weight: 400; color: var(--muted); }
  .tip b { display: block; color: var(--text); font-weight: 500; font-size: 13px; line-height: 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; font-size: 12.5px; color: var(--soft); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  ul.rules { color: var(--soft); font-size: 13px; line-height: 22px; padding-left: 18px; margin: 0; max-width: 1100px; }
  ul.rules b { color: var(--text); }
</style>
</head>

</div>
<main id="app"></main>

let L = 'en';

/* ───────── data model ───────── */
const STATES = {
  active:   { glyph: 'work',  done: 3, time: '12m', p: '60%',  tasks: ['c','c','c','i','n'] },
  paused:   { glyph: 'pause', done: 3, time: '12m', p: '60%',  tasks: ['c','c','c','i','n'] },
  blocked:  { glyph: 'alert', done: 3, time: '12m', p: '60%',  tasks: ['c','c','c','i','n'] },
  waiting:  { glyph: 'chat',  done: 3, time: '12m', p: '60%',  tasks: ['c','c','c','a','n'] },
  complete: { glyph: 'check', done: 5, time: '32m', p: '100%', tasks: ['c','c','c','c','c'] },
};
const ORDER = ['active','paused','blocked','waiting','complete'];
const lab = (s) => ({ active: 'Working', paused: 'Paused', blocked: 'Blocked', waiting: 'Waiting', complete: 'Complete' })[s];
const shortLab = (s) => s === 'waiting' ? I[L].wShort : s === 'complete' ? I[L].cShort : I[L][lab(s)];

const PATHS = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  pause: '<path d="M9 6v12M15 6v12"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V13M12 16.5v.01"/>',
  chat:  '<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  work:  '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
  flag:  '<path d="M6 21V4M6 4.5h11.5l-2.5 4 2.5 4H6"/>',
  x:     '<path d="M7 7l10 10M17 7 7 17"/>',
  circle:'<circle cx="12" cy="12" r="8.5"/>',
  half:  '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/>',
  bot:   '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
};
const svg = (n, cls = '') => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${PATHS[n]}</svg>`;
/* Leading Goal icon. 'state': one glyph that changes shape per state.
   'fixed': constant flag + a 7px status dot on its corner. */
let ICON = 'state';
const withIcon = (m, fn) => { const o = ICON; ICON = m; try { return fn(); } finally { ICON = o; } };
const glyph = (s) => ICON === 'state'
  ? `<span class="gl" style="display:inline-flex">${svg(STATES[s].glyph)}</span>`
  : `<span class="gl fx">${svg('flag')}<b class="sd"></b></span>`;
const pips = (s, tasks = STATES[s].tasks) => `<span class="pips${tasks.length > 8 ? ' many' : ''}" role="img" aria-label="${STATES[s].done}/${tasks.length}">${tasks.map(k => `<i class="${k}"></i>`).join('')}</span>`;
const ring = (s) => `<span class="ring${ICON === 'fixed' ? ' fxr' : ''}" style="--p:${STATES[s].p}">${ICON === 'fixed' ? svg('flag') : s === 'active' ? svg('work') : svg(STATES[s].glyph)}</span>`;
const cnt = (s) => `<span class="cnt">${STATES[s].done}/5</span>`;
const tim = (s) => `<span class="tm">${STATES[s].time}</span>`;
const goal = (s, inner, extra = '') => `<span class="seg goal" data-s="${s}" ${extra} aria-label="Goal">${inner}</span>`;
const title = (flex = false, tm) => `<span class="title${flex ? ' flex' : ''}"${tm ? ` style="--tm:${tm}px"` : ''}>${I[L].title}</span>`;

/* secondary slot: current task (active) or status label (+ blocker text on wide) */
function secondary(s, detail, fade) {
  const t = I[L];
  if (s === 'active') return `<span class="sec${fade ? ' fade' : ''}"><span class="tx">${t.task}</span></span>`;
  const d = detail && s === 'blocked' ? `<span class="tx">${t.blocker}</span>` : '';
  return `<span class="sec${fade ? ' fade' : ''}"><span class="st">${t[lab(s)]}</span>${d}</span>`;
}
const sepChev = '<span class="chev" aria-hidden="true">›</span>';

/* ───────── segment builders: dir × state × width × shared ───────── */
function seg(dir, s, w, shared) {
  const t = I[L];
  if (dir === 'cur') {
    const showTitle = w === 'w' && !shared;
    const done = s === 'complete';
    const lead = done ? `<span style="display:inline-flex;color:var(--ok)">${svg('check')}</span>` : `<span class="bar"><i style="width:${STATES[s].p}"></i></span>`;
    return `<span class="seg goal" data-s="plain" style="--c:var(--accent)">${lead}${showTitle ? title(false) : ''}${cnt(s)}${tim(s)}</span>`;
  }
  if (dir === 'A') {
    let mid = '';
    if (!shared && w === 'w') mid = title(false, 220) + sepChev + secondary(s, true, false);
    else if (!shared && w === 'm') mid = s === 'active' ? title(false, 240) : `<span class="st-label">${t[lab(s)]}</span>`;
    else if (shared && w === 'w') mid = s === 'active' ? title(false, 170) : `<span class="st-label">${shortLab(s)}</span>`;
    return goal(s, glyph(s) + pips(s) + mid + cnt(s) + tim(s));
  }
  if (dir === 'B') {
    const attn = s !== 'active';
    let mid = '';
    if (!shared && w === 'n') mid = s === 'active' ? `<span class="sec"><span class="tx">${t.task}</span></span>` : `<span class="st-label">${t[lab(s)]}</span>`;
    else if (!shared && w === 'm') mid = title(false, 210) + sepChev + (attn ? `<span class="st-label">${shortLab(s)}</span>` : secondary(s, false, true));
    else if (!shared && w === 'w') mid = title(false, 260) + sepChev + secondary(s, true, true);
    else if (shared && w === 'm') mid = title(true);
    else if (shared && w === 'w') mid = title(false, 220) + sepChev + (attn ? `<span class="st-label">${shortLab(s)}</span>` : secondary(s, false, true));
    const time = shared && w === 'n' ? '' : tim(s);
    return goal(s, glyph(s) + mid + cnt(s) + time + `<span class="base" style="--p:${STATES[s].p}"></span>`);
  }
  if (dir === 'C') {
    let label = '', ttl = '';
    if (!shared && w === 'm') { label = `<span class="st-label">${shortLab(s)}</span>`; ttl = title(false, 200); }
    else if (!shared && w === 'w') { label = `<span class="st-label">${t[lab(s)]}</span>`; ttl = title(false, 260); }
    else if (shared && w === 'm') label = `<span class="st-label">${shortLab(s)}</span>`;
    else if (shared && w === 'w') { label = `<span class="st-label">${shortLab(s)}</span>`; ttl = title(false, 170); }
    const body = ring(s) + label + cnt(s);
    const tail = ttl ? `<span class="t-dim" style="display:inline-flex;min-width:0">${ttl}</span>` : '';
    return goal(s, body + tail + tim(s));
  }
}
function agents(w, icon) {
  const t = I[L];
  if (icon && w !== 'n') return `<span class="seg">${svg('bot', 'bot')}${t.agentsW}<span class="meta">·</span><span class="w">${t.agentsN}</span></span>`;
  if (w === 'n') return `<span class="seg">${svg('bot', 'bot')}2<span class="dot warn"></span><span class="w">1</span></span>`;
  return `<span class="seg"><span class="pulse"></span>${t.agentsW}<span class="meta">·</span><span class="w">${t.agentsN}</span></span>`;
}
function pill(dir, s, w, shared, agentIcon) {
  return `<span class="pill">${seg(dir, s, w, shared)}${shared ? agents(w, agentIcon) : ''}</span>`;
}
/* icon study: every direction, both icon modes, all states at the narrowest shared width */
function iconStudy() {
  const t = I[L];
  let h = '';
  ['A','B','C'].forEach(d => {
    ['state','fixed'].forEach(m => {
      h += `<div class="icrow"><div class="iclab"><b>${t['d' + d].split(' · ')[0]} · ${m === 'state' ? t.icState : t.icFixed}</b>${m === 'state' ? t.icStateSub : t.icFixedSub}</div>` +
        ORDER.map(s => withIcon(m, () => pill(d, s, 'n', true))).join('') + '</div>';
    });
  });
  const zoom = (m, s) => `<div class="zoom"><small>${m === 'state' ? t.icState : t.icFixed} · ${t['s_' + s]} · ×2.6</small><div class="z">${withIcon(m, () => pill('A', s, 'n', true, true))}</div></div>`;
  h += `<div class="zoomwrap" style="margin-top:16px">${zoom('state','active')}${zoom('fixed','active')}${zoom('state','waiting')}${zoom('fixed','waiting')}</div>`;
  h += `<div class="icrow" style="margin-top:10px"><div class="iclab"><b>${t.icAgents}</b>${t.icAgentsSub}</div>` +
    ['m','w'].map(w => withIcon('state', () => pill('A', 'active', w, true, true)) ).join('') + '</div>';
  h += `<div class="icrow"><div class="iclab"><b>${t.icExp}</b></div><div style="display:flex;gap:16px;flex-wrap:wrap">${withIcon('fixed', () => panel('waiting', t.icFixed))}</div></div>`;

const stage = (dir, s, w, shared) => `<div class="stage"><small>${shared ? I[L].shared : I[L].alone}</small><div class="row">${pill(dir, s, w, shared)}</div></div>`;

function matrix(dir) {
  const t = I[L];
  let h = `<div class="grid"><div></div><div class="hd">${t.narrow}</div><div class="hd">${t.medium}</div><div class="hd">${t.wide}</div>`;
  ORDER.forEach(s => {
    h += `<div class="rl"><b>${t['s_' + s]}</b></div>`;
    ['n','m','w'].forEach(w => { h += `<div class="cell">${stage(dir, s, w, false)}${stage(dir, s, w, true)}</div>`; });
  });
  return h + '</div>';
}

/* ───────── expanded panel ───────── */
function panel(s, label) {
  const t = I[L], S = STATES[s];
  const kinds = S.tasks.slice();
  const rows = t.tasks.map((txt, i) => {
    let k = kinds[i], ic = { c: 'check', i: 'half', n: 'circle', a: 'pause' }[k], chip = '';
    if (s === 'blocked' && k === 'i') { k = 'x'; ic = 'alert'; chip = `<span class="chip r">${t.blockedChip}</span>`; }
    if (s === 'waiting' && k === 'a') chip = `<span class="chip w">${t.approve}</span>`;
    return `<li data-k="${k}">${svg(ic)}<span class="tt">${txt}</span>${chip}</li>`;
  });
  if (s === 'active') rows.push(`<li data-k="d">${svg('x')}<span class="tt">${t.dropped}</span></li>`);
  const done = s === 'complete';
  const status = `<span class="st">${t[lab(s)]}</span><span>·</span><span>${done ? '32:08' : '12:34'} ${t.elapsed}</span>`;
  const blk = s === 'blocked' ? `<p class="blk">${t.blocker}</p>` : '';
  const ctrl = done ? '' : `<div class="ctrl"><span class="btn">${s === 'paused' ? t.resume : t.pause}</span><span class="btn">${t.edit}</span><span class="btn">${t.stop}</span></div>`;
  return `<div class="shot"><small>${label || t['s_' + s]}</small><div class="panel">
    <div class="phead"><span class="tab" data-s="${s}">${glyph(s)}${pips(s)}<span>${S.done}/5</span><span class="t-dim">· ${done ? '32:08' : '12:34'}</span></span><span class="x">✕</span></div>
    <div class="pbody${done ? ' done' : ''}">
      <p class="obj">${t.objFull}</p>
      <div class="sline" data-s="${s}" role="status">${status}</div>
      <ul class="tasks">${rows.join('')}</ul>${blk}
    </div>${ctrl}</div></div>`;
}

function legend() {
  const t = I[L];
  const items = [
    ['c', 'check', 'c'], ['i', 'half', 'i'], ['n', 'circle', 'n'], ['d', 'x', 'd'], ['a', 'pause', 'a']
  ].map(([k, ic], i) => `<span><span class="pips" style="width:22px;--cf:var(--accent);--c:var(--accent)"><i class="${k}"></i></span><span class="seg goal" style="padding:0;height:auto;background:none;overflow:visible;color:${k==='a'?'var(--warn)':k==='c'?'var(--ok)':k==='i'?'var(--accent)':'var(--faint)'}">${svg(ic)}</span>${t.lg[i]}</span>`);
  const many = `<span><span class="pips many" style="--cf:var(--accent);--c:var(--accent)">${'c'.repeat(7).split('').map(k=>`<i class="${k}"></i>`).join('')}<i class="i"></i>${'n'.repeat(4).split('').map(k=>`<i class="${k}"></i>`).join('')}</span>${t.lgMany}</span>`;

/* ───────── page ───────── */

  <h2>${t.pH}</h2><p class="lead">${t.pLead}</p>

  <h2 style="margin-top:34px">${t.tipH}</h2>
  <div style="display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap">
    <div class="tip"><b>${t.title}</b>${t.tipS} · ${t.task}<br>${t.Working} · 12:34 ${t.elapsed}</div>
    ${pill('A', 'active', 'm', false)}
  </div>

  <h2>${t.rH}</h2><ul class="rules">${t.rules.map(r => `<li>${r}</li>`).join('')}</ul>`;
}
const q = new URLSearchParams(location.hash.slice(1).replace(/,/g, '&').replace(/^(light|dark)$/, 'theme=$1'));
const h = location.hash.slice(1).split(',');
const bT = document.getElementById('bTheme'), bL = document.getElementById('bLang');
function apply() {
  document.documentElement.dataset.theme = bT.getAttribute('aria-pressed') === 'true' ? 'light' : 'dark';
  bT.textContent = bT.getAttribute('aria-pressed') === 'true' ? 'Dark' : 'Light';
  L = bL.getAttribute('aria-pressed') === 'true' ? 'ko' : 'en';
  bL.textContent = L === 'ko' ? 'English' : '한국어';
  render();
}
bT.setAttribute('aria-pressed', h.includes('light'));
bL.setAttribute('aria-pressed', h.includes('ko'));
bT.onclick = () => { bT.setAttribute('aria-pressed', bT.getAttribute('aria-pressed') !== 'true'); apply(); };
bL.onclick = () => { bL.setAttribute('aria-pressed', bL.getAttribute('aria-pressed') !== 'true'); apply(); };
apply();
</script>
