<style>

  --mx-popup-bg: var(--mx-bg-base);
  --mx-popup-shadow: 0 12px 28px rgb(0 0 0 / 28%), 0 2px 6px rgb(0 0 0 / 16%);
  --mx-op-disabled: .6;
  --mx-font-sans: "Pretendard Variable", Pretendard, "Malgun Gothic", "Segoe UI", sans-serif;
  --mx-font-mono: "JetBrains Mono Variable", "JetBrains Mono", Consolas, monospace;

}

  --mx-bg-base: #fff; --mx-bg-layer-1: #f3f3f3; --mx-bg-layer-2: #eee; --mx-bg-layer-3: #e8e8e8;

  --mx-user-bubble: var(--mx-bg-layer-2);
  --mx-text: #222; --mx-text-muted: #606060;
  --mx-text-accent: #185abc;
  --mx-border-muted: rgba(20,20,20,.1); --mx-border: rgba(20,20,20,.15); --mx-border-strong: rgba(20,20,20,.3);
  --mx-hover: rgba(119,119,119,.09); --mx-pressed: rgba(119,119,119,.17);
  --mx-danger: #b82d35; --mx-danger-bg: #fceceb; --mx-success: #137333; --mx-success-bg: #e7f9ea;

* { box-sizing: border-box; }

/* ═════ A: Claude 방식 — 카드 없는 인라인 목록 ═════ */
.ca { margin: 6px -8px 0; font-size: 14px; line-height: 20px; }

/* ═════ B: Codex 방식 — 리소스 카드 + 행 + 호버 미리보기 ═════ */
.cx { position: relative; margin-top: 10px; border-radius: var(--mx-radius-lg); box-shadow: inset 0 0 0 1px var(--mx-border-muted); font-size: 14px; line-height: 20px; }

  x: ['M6 6l12 12', 'M18 6 6 18'],
  out: ['M14 4h6v6', 'M20 4l-8.5 8.5', 'M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10'],
  upRight: ['M7 17 17 7', 'M8 7h9v9'],
  pm: ['M7 4v6', 'M4 7h6', 'M14 17h6', 'M18 5 6 19'],
  panel: ['M4 5h16v14H4z', 'M14 5v14'],
};
const ic = (n, s = 14, sw) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24"${sw ? ` style="stroke-width:${sw}"` : ''}>${P[n].map(d => `<path d="${d}"/>`).join('')}</svg>`;
const st = (a, d) => `<span class="st">${a ? `<i>+${a}</i>` : ''}${d ? `<em>\u2212${d}</em>` : ''}</span>`;
const shortOut = '~/AppData/Local/Temp/mixdog-dl-outside';

const TRANSCRIPT = `
  <div class="ubub">메모 두 개에 한 줄씩 추가해 줘</div>
  <p class="prose"><code>note.txt</code>에 세 줄, 프로젝트 밖 <code>outside-note.txt</code>에 한 줄을 추가했습니다.</p>`;
const island = (on) => `<div class="island-slot"><div class="island"><span class="iseg"><span class="dot"></span>준비됨</span><span class="rule"></span><button class="iseg${on ? ' on' : ''}" type="button">${ic('fileDiff', 14)}파일 2 <span class="st" style="font-family:inherit"><i>+${TOTAL}</i></span></button></div></div>`;
const composer = `<div class="composer">메시지 입력…</div>`;
const pane = (kind, card, onIsland) => `<div><p class="cap">${kind === 'desk' ? '데스크톱 · 630px' : '휴대폰 · 360px'}</p><div class="pane ${kind}">${TRANSCRIPT}${card}${island(onIsland)}${composer}</div></div>`;

const DIFF = {
  'note.txt': [['h', '', '@@ -1,2 +1,5 @@'], ['c', 1, '# 메모'], ['c', 2, ''], ['a', 3, '- 장보기: 우유, 달걀'], ['a', 4, '- 금요일 회의 자료 정리'], ['a', 5, '- 운동 30분']],
  'outside-note.txt': [['h', '', '@@ -1 +1,2 @@'], ['c', 1, '임시 메모'], ['a', 2, '프로젝트 밖에서 추가한 줄']],
};
const diff = (name) => `<div class="diff">${DIFF[name].map(([k, n, t]) => `<div class="${k}"><b>${n}</b><s>${k === 'a' ? '+' : ' '}</s>${t || ' '}</div>`).join('')}</div>`;
const preview = (f, style) => `<div class="pv" style="${style}"><div class="pv-h">${f.base}${st(f.add, f.del)}</div>${diff(f.base)}</div>`;

/* ── 현재 ── */
function current(kind) {
  const rows = FILES.map((f, i) => `<li><button class="main" type="button"><span class="path">${f.dir ? `<span class="dir">${f.dir}</span>` : ''}<span class="base">${f.base}</span></span>${st(f.add, f.del)}</button><button class="rv" type="button" aria-label="되돌리기">${ic('undo', 12)}</button></li>`).join('');
  return `<section class="cur"><div class="head"><button class="sum" type="button"><span class="tile">${ic('fileDiff', 14)}</span><span class="ttl"><strong>파일 2개 편집함</strong><span>${st(TOTAL, 0)}</span></span></button><button class="act" type="button">실행 취소 ${ic('undo', 11)}</button></div><ul>${rows}</ul></section>`;
}

/* ── A: Claude 방식 ── */
function claude(kind) {
  const touch = kind === 'phone';
  const rows = FILES.map((f, i) => {
    const hov = !touch && i === 1;
    const hint = f.out ? `<span class="ext" title="${f.dir}">${ic('out', 12)}${touch ? '프로젝트 밖' : 'Temp/mixdog-dl-outside'}</span>` : '';
    return `<li class="filerow${f.out ? ' out' : ''}${hov ? ' hov' : ''}"><span class="lab"><span class="ftype">${ic('file', 16, 1.75)}</span><span class="nm trunc">${f.base}</span>${hint}</span><span class="acts"><button class="ibtn" type="button" aria-label="이 파일 되돌리기" title="이 파일만 되돌리기">${ic('undo', 13)}</button></span><span class="meta">${st(f.add, f.del)}<span class="chev">${ic('chevR', 14)}</span></span></li>`;
  }).join('');
  return `<section class="ca${touch ? ' touch' : ''}"><ul>
    <li class="sumrow"><span class="lab">${ic('pm', 16, 1.75)}<span class="nm">파일 2개 변경됨</span></span><button class="tbtn ghost" type="button">실행 취소</button><span class="meta">${st(TOTAL, 0)}<span class="chev">${ic('chevR', 14)}</span></span></li>
    ${rows}</ul></section>`;
}

/* ── B: Codex 방식 ── */
function codex(kind, demo = false) {
  const touch = kind === 'phone';
  const rows = FILES.map((f, i) => {
    const hov = demo && i === 0;
    const dir = f.out ? `<span class="ext" title="${f.dir}">${ic('out', 12)}</span><span class="dir">${touch ? '…/mixdog-dl-outside/' : shortOut + '/'}</span>` : '';
    return `<li class="${hov ? 'hov' : ''}"><span class="path">${dir}<span class="base">${f.base}</span></span>${st(f.add, f.del)}<span class="rowact"><button class="ibtn" type="button" aria-label="이 파일 되돌리기">${ic('undo', 13)}</button></span>${hov ? preview(f, 'left:120px;top:40px') : ''}</li>`;
  }).join('');
  return `<section class="cx${touch ? ' touch' : ''}"><div class="hd${demo ? ' hov' : ''}">${ic('fileDiff', 16, 1.75)}<span class="ttl"><strong>파일 2개 변경됨</strong><span class="sub-d">${st(TOTAL, 0)}</span><span class="sub-h">변경 보기 ${ic('upRight', 11)}</span></span><span class="trail"><button class="tbtn" type="button">실행 취소 ${ic('undo', 12)}</button>${touch ? '' : `<button class="tbtn outline" type="button">검토</button>`}</span></div><ul>${rows}</ul></section>`;
}

/* ── C: 혼합 ── */
function blend(kind, open = true) {
  const touch = kind === 'phone';
  const rows = FILES.map((f, i) => {
    const hov = !touch && i === 1;
    const loc = f.out ? `<span class="ext" title="${f.dir}">${ic('out', 12)}${touch ? '프로젝트 밖' : shortOut}</span>` : '';
    return `<li class="${hov ? 'hov' : ''}"><span class="ftype">${ic('file', 16, 1.75)}</span><span class="nm">${f.base}</span>${f.out ? `<span class="loc">${loc}</span>` : ''}<span class="grow"></span>${st(f.add, f.del)}<button class="ibtn" type="button" aria-label="이 파일 되돌리기" title="이 파일만 되돌리기">${ic('undo', 13)}</button><span class="chev">${ic('chevR', 14)}</span></li>`;
  }).join('');
  return `<section class="mx${touch ? ' touch' : ''}" data-open="${open}"><div class="hd"><button class="tog" type="button" aria-expanded="${open}"><span class="car">${ic('chevR', 14)}</span><strong>파일 2개 변경됨</strong>${st(TOTAL, 0)}</button><button class="tbtn" type="button">${ic('undo', 13)}실행 취소</button>${touch ? '' : `<span class="sep"></span><button class="ibtn" type="button" aria-label="변경 패널에서 보기">${ic('panel', 14)}</button>`}</div><div class="body"><ul>${rows}</ul></div></section>`;
}

/* ── navigation sheets, styled per option ── */
function listSheet(style) {
  let body;
  if (style === 'claude') body = `<div class="ca touch" style="margin:0"><ul>${FILES.map(f => `<li class="filerow"><span class="lab"><span class="ftype">${ic('file', 16, 1.75)}</span><span class="nm trunc">${f.base}</span>${f.out ? `<span class="ext">${ic('out', 12)}프로젝트 밖</span>` : ''}</span><span class="acts"><button class="ibtn" type="button">${ic('undo', 13)}</button></span><span class="meta">${st(f.add, f.del)}<span class="chev">${ic('chevR', 14)}</span></span></li>`).join('')}</ul></div>`;
  else if (style === 'codex') body = `<div class="cx touch" style="margin:0;box-shadow:none"><ul style="border-top:0">${FILES.map(f => `<li style="border-radius:var(--mx-radius-md);background:none"><span class="path">${f.out ? `<span class="ext">${ic('out', 12)}</span><span class="dir">…/mixdog-dl-outside/</span>` : ''}<span class="base">${f.base}</span></span>${st(f.add, f.del)}<span class="rowact"><button class="ibtn" type="button">${ic('undo', 13)}</button></span></li>`).join('')}</ul></div>`;
  else body = `<div class="mx touch" data-open="true" style="margin:0;box-shadow:none"><ul>${FILES.map(f => `<li><span class="ftype">${ic('file', 16, 1.75)}</span><span class="nm">${f.base}</span>${f.out ? `<span class="loc"><span class="ext">${ic('out', 12)}프로젝트 밖</span></span>` : ''}<span class="grow"></span>${st(f.add, f.del)}<button class="ibtn" type="button">${ic('undo', 13)}</button><span class="chev">${ic('chevR', 14)}</span></li>`).join('')}</ul></div>`;
  return `<div class="sheet"><div class="sh-h"><span class="grow"><strong>파일 2개 변경됨</strong>${st(TOTAL, 0)}</span><button class="ibtn" type="button" aria-label="닫기">${ic('x', 14)}</button></div><div class="sh-b">${body}</div><div class="sh-f"><span>이번 턴</span><button class="tbtn${style === 'codex' ? ' outline' : ''}" type="button">${ic('undo', 13)}전체 실행 취소</button></div></div>`;
}
function detailSheet(f) {
  return `<div class="sheet"><div class="sh-h back"><button class="ibtn" type="button" aria-label="목록으로">${ic('chevL', 16)}</button><span class="grow"><strong class="trunc">${f.base}</strong>${st(f.add, f.del)}</span><button class="tbtn" type="button">${ic('undo', 13)}되돌리기</button></div>${f.out ? `<div class="path-line">${ic('out', 12).replace('class="i"', 'class="i" style="display:inline;vertical-align:-1px;margin-right:4px"')}프로젝트 밖 · ${f.dir}</div>` : ''}${diff(f.base)}</div>`;
}
const flow = (style) => `<div class="flow">
  <div class="step"><p class="cap"><b>① 섬 → 목록</b> · 「파일 2 +4」를 누르면 위로 펼쳐짐</p>${listSheet(style)}<div class="island-under">${island(true)}</div></div>
  <div class="step"><p class="cap"><b>② 파일 → 상세</b> · 같은 시트 안 diff, ‹ 로 목록 복귀</p>${detailSheet(FILES[1])}</div>
  <div class="step"><p class="cap"><b>② 상세</b> · 프로젝트 안 파일</p>${detailSheet(FILES[0])}</div>
</div>`;

const OPTIONS = [
  { id: 'cur', title: '현재', ref: '구현 그대로', note: '<b>TurnChangesCard.tsx</b> + <b>27-search-review.css</b> 재현: 26px 아이콘 타일 + 두 줄 제목(제목/합계), 헤더 호버 시 합계가 「변경 보기 ›」로 바뀜, 행 36px·디렉터리 흐림 + 파일명 500, 행 끝 12px 되돌리기. 프로젝트 밖 파일은 절대 경로가 그대로 붙어 행이 길고 거칠게 보이는 것이 주요 문제. (제목은 현재 문자열 「파일 2개 편집함」)', render: current, flow: null },
  { id: 'a', title: 'A안', ref: 'Claude 방식', note: '카드 테두리 없이 대화 흐름에 붙는 <b>인라인 목록</b>. 요약 행(± 아이콘 · 「파일 2개 변경됨」 · 고스트 「실행 취소」 · +합계 · ›)과 파일 행(파일 아이콘 · 파일명 · 흐린 폴더 힌트 · +/− · ›)이 같은 30px 행 문법을 공유, 호버는 6px 고스트 플레이트. 요약 행 클릭 = 변경 패널, 파일 행 클릭 = 해당 파일 diff. 파일별 되돌리기는 호버 시 행 안에 나타남(레퍼런스엔 없는 보강), 휴대폰은 항상 표시. 4개 이상이면 3개 + 「파일 N개 더 보기」.', render: claude, flow: 'claude' },
  { id: 'b', title: 'B안', ref: 'Codex 방식', note: '<b>리소스 카드</b>: 44px 헤더(아이콘 · 제목 · 합계 → 호버 시 「변경 보기 ↗」) + 오른쪽 고스트 「실행 취소 ↶」와 외곽선 「검토」. 아래 36px 행은 <b>디렉터리(흐림)/파일명</b> 한 줄, 행 호버 시 해당 파일 diff 미리보기 팝업. 헤더 전체가 변경 탭을 여는 버튼. 레퍼런스는 행에 되돌리기가 없어서 호버 시 오른쪽 거터에 아이콘을 추가. 프로젝트 밖은 ↗ 아이콘 + 줄인 경로.', render: codex, flow: 'codex' },
  { id: 'c', title: 'C안 (추천)', ref: '혼합 · Codex 카드 + Claude 행', note: 'Codex의 카드 묶음과 헤더 액션 위치를 유지하되, 헤더를 <b>40px 한 줄</b>(› 접기 · 제목 · 합계)로 줄이고 아이콘 타일을 제거. 행은 Claude식 <b>파일 아이콘 + 파일명 + 흐린 위치 힌트</b>(프로젝트 밖일 때만), +/−, 항상 보이는 옅은 되돌리기 아이콘(호버 시 진해짐), 호버 시 ›. 기본은 펼침(≤3개), 많으면 3개 + 더 보기; 헤더를 눌러 접을 수 있음. 패널 아이콘 = 변경 패널 열기.', render: blend, flow: 'blend' },
];

document.getElementById('app').innerHTML = OPTIONS.map(o => `
  <section class="opt" id="opt-${o.id}">
    <div class="opt-head"><h2>${o.title}</h2><span class="ref">${o.ref}</span></div>
    <p class="opt-note">${o.note}</p>
    <div class="row">${pane('desk', o.render('desk'), false)}${pane('phone', o.render('phone'), false)}</div>
    ${o.id === 'c' ? `<div class="row" style="margin-top:18px"><div><p class="cap">접힌 상태 · 630px</p><div class="pane desk" style="padding-top:6px">${blend('desk', false)}</div></div></div>` : ''}
    ${o.id === 'b' ? `<div class="row" style="margin-top:18px"><div><p class="cap">호버 상태 · 헤더 → 「변경 보기 ↗」, 행 → diff 미리보기</p><div class="pane desk" style="padding-top:6px;height:330px">${codex('desk', true)}</div></div></div>` : ''}
    ${o.flow ? flow(o.flow) : ''}
  </section>`).join('');

function setTheme(t) {
  document.documentElement.dataset.mixdogTheme = t;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
document.addEventListener('click', e => {
  const tog = e.target.closest('.mx .tog');
  if (!tog) return;
  const card = tog.closest('.mx');
  const open = card.dataset.open !== 'true';
  card.dataset.open = String(open);
  tog.setAttribute('aria-expanded', String(open));
});
setTheme(new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark');
</script>
</body>
</html>
