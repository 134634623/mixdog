<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>컴포저 아일랜드 시안</title>
<style>
  :root {
    --mx-bg-deep: #101013; --mx-window-band: #18181b; --mx-workspace-sheet: #111113; --mx-bg-base: #222225;
    --mx-bg-layer-1: #2a2a2d; --mx-bg-layer-2: #323236; --mx-bg-layer-3: #3d3d41; --mx-composer-surface: var(--mx-bg-layer-1);
    --mx-text: #e9e9e9; --mx-text-muted: #a8a8a8; --mx-text-soft: color-mix(in srgb, var(--mx-text) 85%, transparent);
    --mx-accent: #79b8ff; --mx-accent-bg: #1967d2;
    --mx-warning: #f2cf76; --mx-warning-bg: #443f2e; --mx-success: #6bd586; --mx-danger: #f17471;
    --mx-border-muted: rgba(255,255,255,.09); --mx-border: rgba(255,255,255,.125); --mx-border-strong: rgba(255,255,255,.24);
    --mx-hover: rgba(255,255,255,.08); --mx-pressed: rgba(255,255,255,.12);
    --mx-raised: 0 2px 4px #0000004d, 0 1px 2px #0000004d, 0 0 0 1px #ffffff29, 0 -0.5px 0 #ffffff0f;
    --mx-composer-lift: 0 12px 24px -4px rgb(0 0 0 / 22%);
    --mx-popup-shadow: 0 12px 28px rgb(0 0 0 / 28%), 0 2px 6px rgb(0 0 0 / 16%);
    --mx-button: 0 0 0 1px #ffffff33;
    --r-md: 6px; --r-xl: 12px; --r-sheet: 16px; --r-pill: 999px;
    --island-bg: #0b0b0d; --island-edge: 0 0 0 1px rgba(255,255,255,.13);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mx-bg-deep); color: var(--mx-text); font: 400 14px/20px "Pretendard Variable", Pretendard, "Malgun Gothic", "Segoe UI", sans-serif;
         display: grid; grid-template-columns: 320px 1fr; height: 100vh; overflow: hidden; }

  /* 왼쪽: 단계 목록 */
  aside { background: var(--mx-window-band); border-right: 1px solid var(--mx-border-muted); display: flex; flex-direction: column; min-height: 0; }
  aside .top { padding: 18px 18px 10px; }
  aside h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  aside .sub { font-size: 12.5px; color: var(--mx-text-muted); line-height: 18px; }
  .steps { flex: 1; overflow: auto; padding: 4px 10px; display: flex; flex-direction: column; gap: 2px; }
  .grp { font-size: 12px; color: var(--mx-text-muted); padding: 12px 8px 4px; font-weight: 500; }
  .step { text-align: left; border: 0; border-radius: var(--r-md); padding: 6px 10px; background: transparent; color: var(--mx-text-soft);
          font: inherit; font-size: 13px; line-height: 18px; cursor: pointer; display: flex; gap: 8px; }
  .step .n { color: var(--mx-text-muted); width: 18px; flex: none; font-variant-numeric: tabular-nums; }
  .step:hover { background: var(--mx-hover); color: var(--mx-text); }
  .step[aria-current="true"] { background: var(--mx-pressed); color: var(--mx-text); }
  .navbar { display: flex; gap: 6px; padding: 10px 18px 16px; border-top: 1px solid var(--mx-border-muted); }
  .btn { border: 0; border-radius: var(--r-md); padding: 0 12px; height: 28px; background: transparent; box-shadow: var(--mx-button); color: var(--mx-text); font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover { background: var(--mx-hover); }
  .btn.p { background: var(--mx-accent-bg); box-shadow: none; color: #fff; }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 12.5px; }

  /* 오른쪽: 앱 창 */
  .stage { display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 18px 22px 16px; gap: 12px; }
  .win { position: relative; border-radius: var(--r-xl); overflow: hidden; background: var(--mx-workspace-sheet); box-shadow: inset 0 0 0 1px var(--mx-border-muted);
         display: flex; flex-direction: column; min-height: 0; }
  .tabbar { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--mx-border-muted);
            background: var(--mx-window-band); font-size: 13px; color: var(--mx-text-soft); }
  .tabbar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mx-accent); }
  .tabbar .meter { margin-left: auto; font-size: 12px; color: var(--mx-text-muted); font-variant-numeric: tabular-nums; }
  .tabbar .meter b { color: var(--mx-success); font-weight: 500; }
  .body { position: relative; flex: 1; min-height: 0; }
  .col { position: absolute; inset: 0; max-width: 848px; margin: 0 auto; padding: 0 24px; }
  .transcript { position: absolute; left: 24px; right: 24px; top: 0; bottom: 168px; padding: 20px 0 14px;
                display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; overflow: hidden; }
  .older { color: var(--mx-text-soft); line-height: 24px; font-size: 15px; }
  .u { align-self: flex-end; max-width: 72%; background: var(--mx-bg-layer-1); border-radius: var(--r-sheet); padding: 9px 14px; }
  .a { line-height: 24px; font-size: 15px; }
  code { font: 13px "JetBrains Mono", Consolas, monospace; color: var(--mx-accent); }
  .tool-row, .turnline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mx-text-muted); }
  .turnline { font-weight: 500; } .tool-row b { color: var(--mx-text-soft); font-weight: 500; }
  .acc { color: var(--mx-accent); } .plus { color: var(--mx-success); } .minus { color: var(--mx-danger); } .warn { color: var(--mx-warning); } .muted { color: var(--mx-text-muted); } .ok { color: var(--mx-success); }
  .spin { display: inline-block; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 하단 독: 섬 자리 44px + 입력창 96px + 바닥 16px — 항상 156px */
  .dock { position: absolute; left: 24px; right: 24px; bottom: 0; height: 168px; }
  .slot { position: absolute; left: 0; right: 0; bottom: 112px; height: 56px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; pointer-events: none; }
  .slot > .island { position: relative; z-index: 1; }
  .slot.expanded::before { content: ""; position: absolute; left: -24px; right: -24px; bottom: 0; height: var(--fade-h, 0px);
                           background: linear-gradient(to bottom, rgba(17,17,19,0), rgba(17,17,19,.92) 48px, var(--mx-workspace-sheet)); }
  .composer { position: absolute; left: 0; right: 0; bottom: 16px; height: 96px; border-radius: var(--r-sheet); background: var(--mx-composer-surface);
              box-shadow: var(--mx-raised), var(--mx-composer-lift); padding: 12px 10px 8px 14px; display: flex; flex-direction: column; justify-content: space-between;
              transition: opacity .18s var(--ease), filter .18s var(--ease); z-index: 1; }
  .composer.dim { opacity: .4; filter: saturate(.6); }
  .ph { color: var(--mx-text-muted); }
  .bar { display: flex; align-items: center; gap: 2px; }
  .tool { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r-md); color: var(--mx-text-muted); font-size: 16px; }
  .model { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: var(--r-md); white-space: nowrap; }
  .model .e { color: var(--mx-text-muted); }
  .ring { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--mx-text) 30%, transparent); margin: 0 6px; }
  .send { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--mx-bg-layer-2); color: var(--mx-text-muted); font-size: 11px; }
  .send.go { background: var(--mx-text); color: var(--mx-workspace-sheet); }

  /* ── 섬 ── */
  .island { pointer-events: auto; background: var(--island-bg); box-shadow: var(--island-edge), var(--mx-popup-shadow); color: var(--mx-text);
            border-radius: 22px; overflow: hidden; max-width: 100%; transform-origin: 50% 100%; animation: pop .24s var(--ease); }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  .island.empty { width: 10px; height: 10px; border-radius: 50%; background: transparent; box-shadow: none; animation: none; }
  .island .pill { display: flex; align-items: center; height: 36px; padding: 0 6px; white-space: nowrap; font-size: 13px; }
  .seg { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: var(--r-pill); color: var(--mx-text-soft); font-variant-numeric: tabular-nums; cursor: pointer; }
  .seg:hover, .seg.on { background: rgba(255,255,255,.08); color: var(--mx-text); }
  .seg .t { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  .seg.lead { color: var(--mx-text); }
  .seg.w { color: var(--mx-warning); }
  .vsep { width: 1px; height: 14px; background: rgba(255,255,255,.12); margin: 0 2px; flex: none; }
  .mini-ring { flex: none; }
  .island .panel { width: 560px; max-width: 100%; }
  .island .phead { display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 13px; }
  .island .phead .close { margin-left: auto; color: var(--mx-text-muted); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; cursor: pointer; }
  .island .pbody { padding: 10px 14px 12px; font-size: 13px; line-height: 20px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 34px; }
  .row + .row { border-top: 1px solid rgba(255,255,255,.06); }
  .row .main { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--mx-text-muted); font-size: 12px; }
  .row .acts { display: flex; gap: 4px; flex: none; }
  .ghost { border: 0; background: transparent; color: var(--mx-text-muted); font: inherit; font-size: 12.5px; height: 26px; padding: 0 9px; border-radius: var(--r-md); cursor: pointer; }
  .ghost:hover { background: rgba(255,255,255,.08); color: var(--mx-text); }
  .tasks .row .ic { width: 16px; text-align: center; flex: none; }
  .pfoot { display: flex; gap: 6px; justify-content: flex-end; padding-top: 8px; }
  .island pre { margin: 6px 0 10px; padding: 8px 10px; border-radius: 10px; background: #18181b; font: 13px/18px "JetBrains Mono", Consolas, monospace; white-space: pre-wrap; }
  .island .approval .ttl { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .island .approval .ttl small { font-weight: 400; color: var(--mx-text-muted); font-size: 12.5px; }
  .kbd { font-size: 11.5px; color: var(--mx-text-muted); margin-right: auto; align-self: center; }
  .flash { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; font-size: 13px; white-space: nowrap; }
  .island.flashing { box-shadow: var(--island-edge), 0 0 0 4px rgba(107,213,134,.12), var(--mx-popup-shadow); }

  /* 대기 메시지 트레이: 입력창 위에 이어 붙여 쌓음 */
  .qtray { position: absolute; left: 0; right: 0; bottom: 111px; z-index: 0; background: var(--mx-composer-surface); border-radius: var(--r-sheet) var(--r-sheet) 0 0;
           box-shadow: var(--mx-raised); padding: 4px 8px 2px 14px; animation: rise .2s var(--ease); max-height: 112px; overflow-y: auto; scrollbar-width: none; }
  @keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
  .qtray .qr { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 13.5px; }
  .qtray .qr + .qr { border-top: 1px solid var(--mx-border-muted); }
  .qtray .k { color: var(--mx-text-muted); font-size: 12.5px; flex: none; }
  .qtray .v { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qtray .ghost.steer { color: var(--mx-accent); }
  .composer.joined { border-top-left-radius: 0; border-top-right-radius: 0; }

  /* 새 대화: 지금 앱의 설정줄 그대로 (고스트 칩, 입력창 위) */
  .ctxbar { position: absolute; left: 0; right: 0; bottom: 118px; height: 28px; display: flex; align-items: center; gap: 6px; }
  .ghostchip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: var(--r-md); color: var(--mx-text); font-size: 14px; }
  .ghostchip .muted { font-size: 12px; }

  /* 오른쪽 변경 파일 패널 */
  .body.split .col { right: 420px; }
  .side { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: var(--mx-window-band); border-left: 1px solid var(--mx-border-muted);
          display: flex; flex-direction: column; animation: slide .22s var(--ease); }
  @keyframes slide { from { transform: translateX(24px); opacity: .5; } to { transform: none; opacity: 1; } }
  .side .sh { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--mx-border-muted); font-size: 13px; }
  .side .sh b { font-weight: 600; }
  .side .sh .r { margin-left: auto; display: flex; gap: 2px; }
  .seg2 { font-size: 12px; padding: 2px 8px; border-radius: var(--r-md); color: var(--mx-text-muted); }
  .seg2.on { background: var(--mx-pressed); color: var(--mx-text); }
  .side .files { padding: 6px 8px; border-bottom: 1px solid var(--mx-border-muted); }
  .side .f { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--r-md); font-size: 13px; }
  .side .f.on { background: var(--mx-pressed); }
  .side .f .st { width: 14px; color: var(--mx-warning); font-size: 12px; } .side .f .st.a { color: var(--mx-success); }
  .side .f .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .hunk { flex: 1; overflow: hidden; font: 12.5px/19px "JetBrains Mono", Consolas, monospace; padding: 8px 0; }
  .side .hunk div { padding: 0 14px; white-space: pre; }
  .side .hunk .hh { color: var(--mx-text-muted); background: rgba(121,184,255,.06); }
  .side .hunk .ad { background: rgba(107,213,134,.10); } .side .hunk .rm { background: rgba(241,116,113,.10); }
  .side .f.hov { background: var(--mx-hover); }
  .side .f .go { color: var(--mx-text-muted); width: 12px; text-align: right; }
  .sidenote { padding: 6px 16px; font-size: 12px; color: var(--mx-text-muted); }
  .side .sh .back { width: 26px; height: 26px; display: grid; place-items: center; border-radius: var(--r-md); background: var(--mx-hover); font-size: 16px; margin-left: -6px; }
  .side .sh .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .crumb { display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 12px; color: var(--mx-text-soft); border-bottom: 1px solid var(--mx-border-muted); }
  .crumb .nav2 { margin-left: auto; display: flex; gap: 10px; color: var(--mx-text-muted); }
  .seg.picked { box-shadow: inset 0 0 0 1px var(--mx-border-strong); color: var(--mx-text); }

  .explain { border-radius: var(--r-xl); box-shadow: inset 0 0 0 1px var(--mx-border-muted); padding: 12px 16px; font-size: 13px; color: var(--mx-text-soft); line-height: 20px; min-height: 64px; }
  .explain b { color: var(--mx-text); font-weight: 600; }
</style>
</head>
<body>
<aside>
  <div class="top"><h1>컴포저 아일랜드</h1><div class="sub">입력창 위 고정 자리의 섬 하나가 모든 상태를 담습니다. 섬은 모였다가, 펼쳐지고, 승인 카드로 커지고, 소식을 잠깐 알렸다가 다시 작아집니다. ←→ 키로 넘겨 보세요.</div></div>
  <div class="steps" id="steps"></div>
  <div class="navbar"><button class="btn" id="prev">← 이전</button><button class="btn p" id="next">다음 →</button></div>
</aside>
<div class="stage">
  <div class="win">
    <div class="tabbar"><span class="dot"></span>결제 모듈 이전<span class="meter" id="meter"></span></div>
    <div class="body" id="body"><div id="sidepanel"></div><div class="col">
      <div class="transcript" id="tx"></div>
      <div class="dock">
        <div class="slot" id="slot"></div>
        <div id="qtray"></div>
        <div class="composer" id="composer"><div class="ph" id="ph">메시지 입력…</div><div class="bar" id="cbar"></div></div>
      </div>
    </div></div>
  </div>
  <div class="explain" id="explain"></div>
</div>

<script>
const spin = '<span class="acc"><span class="spin">⟳</span></span>';
function ring(p, size = 16) {
  const r = size / 2 - 2, c = 2 * Math.PI * r;
  return '<svg class="mini-ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#3d3d41" stroke-width="2"/><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r +
    '" fill="none" stroke="#79b8ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c * (1 - p) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/></svg>';
}
const HEAD = '<div class="older">클라이언트는 <code>PaymentsClient</code> 하나로 묶여 있고, 웹훅 처리는 <code>webhook.ts</code>에 따로 있습니다. 새 API는 서명 방식이 달라서 검증 로직도 바꿔야 합니다.</div><div class="u">결제 모듈을 새 API로 옮겨줘. 테스트도 같이.</div>';
const TX = {
  draft: '',
  reading: HEAD + '<div class="tool-row">' + spin + '<b>Read</b> src/payments/client.ts</div><div class="turnline">' + spin + '응답 중 · 12s</div>',
  bg: HEAD + '<div class="a">테스트를 백그라운드로 돌리고, 웹훅 검증은 Worker에게 맡겼습니다.</div><div class="turnline">' + spin + '응답 중 · 1m 04s</div>',
  approve: HEAD + '<div class="a">스테이징 DB에 마이그레이션을 적용하려고 합니다.</div>',
  migrated: HEAD + '<div class="a">마이그레이션을 적용했습니다.</div><div class="turnline">' + spin + '응답 중 · 2m 31s</div>',
  waiting: HEAD + '<div class="a">마이그레이션까지 끝냈습니다. 테스트와 웹훅 검증은 백그라운드에서 계속 돌고 있습니다.</div><div class="turnline">' + spin + '백그라운드 작업 2개 대기 중 · 셸 1 · 에이전트 1</div>',
  done: HEAD + '<div class="a">마이그레이션까지 끝냈습니다. 테스트 42개 통과, 웹훅 서명 검증도 확인했습니다.</div><div class="turnline"><span class="ok">✓</span>완료 · 11m 02s</div>',
  goal: HEAD + '<div class="a">다음 단계로 웹훅 서명 검증을 새 방식으로 바꾸겠습니다.</div><div class="turnline"><span class="ok">✓</span>완료 · 2m 10s</div>',
};

/* 섬 조각 */
const S = {
  goal: (p = 0.6, t = '3/5 · 12m') => '<span class="seg lead">' + ring(p) + '<span class="t">결제 모듈을 새 API로 이전</span><span class="muted">' + t + '</span></span>',
  goalShort: '<span class="seg lead">' + ring(0.6) + '3/5</span>',
  jobs: (n = 2) => '<span class="seg">' + spin + '작업 ' + n + '</span>',
  queue: (n = 1) => '<span class="seg">대기 ' + n + '</span>',
  diff: '<span class="seg">파일 4 <span class="plus">+128</span><span class="minus">−41</span></span>',
  model: '<span class="seg w">⚠ 이 대화: Claude</span>',
  draft: '<span class="seg">📁 mixdog ⌄</span><span class="vsep"></span><span class="seg">Default ⌄</span><span class="vsep"></span><span class="seg">Swarm ⌄</span>',
};
const pill = (...segs) => '<div class="island"><div class="pill">' + segs.filter(Boolean).join('<span class="vsep"></span>') + '</div></div>';
function panel(tabs, active, body, foot = '') {
  const head = tabs.map(([k, label]) => '<span class="seg' + (k === active ? ' on' : '') + '">' + label + '</span>').join('');
  return '<div class="island"><div class="panel"><div class="phead">' + head + '<span class="close">✕</span></div><div class="pbody">' + body + (foot ? '<div class="pfoot">' + foot + '</div>' : '') + '</div></div></div>';
}
const TABS_RUN = [['jobs', spin + '작업 2'], ['queue', '대기 1']];
const TABS_END = [['goal', ring(0.6) + '3/5'], ['jobs', spin + '작업 2'], ['diff', '파일 4']];
const BODY = {

  jobs: '<div class="row"><span>' + spin + '</span><span class="main">셸 · <code>npm test -- --watch=false</code></span><span class="sub">2m 14s</span><span class="acts"><button class="ghost">출력</button><button class="ghost">중지</button></span></div>' +
