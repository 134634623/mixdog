name: linux-desktop-verify

# Fast lane (default push): tests + tsc + i18n, AppImage/.deb build, basic
# headless smoke, glibc floor. Full lane (workflow_dispatch full=true, a
# [linux-full] commit message, or the release workflow): also the N->N+1
# update proof, the sandbox-enabled .deb smoke and the distro container
# smokes (which exec every bundled native tool).
on:
  push:
    branches: [release/linux]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the heavy suite (update proof, sandbox .deb smoke, container smokes)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.p.outputs.full }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FULL: ${{ inputs.full }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          full=false
          case "$EVENT" in
            workflow_call|workflow_dispatch) [ "$INPUT_FULL" = true ] && full=true ;;
            push) case "$MSG" in *"[linux-full]"*) full=true ;; esac ;;
          esac
          case "$GITHUB_REF" in refs/tags/*) full=true ;; esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full lane: $full"

  # Native tools built inside manylinux_2_28 (glibc 2.28) so the package floor
  # does not follow the glibc of the CI runner (graph/patch releases are built
  # on ubuntu-22.04 = 2.34; mixdog-computer on a 24.04 host would need 2.39).
  native-tools:
    name: native-tools-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64, image: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { runner: ubuntu-24.04-arm, arch: arm64, image: "quay.io/pypa/manylinux_2_28_aarch64" }
    steps:
      - uses: actions/checkout@v5
      - name: Cache built tools
        id: cache
        uses: actions/cache@v4
        with:
          path: native-out
          key: native-glibc228-${{ matrix.arch }}-${{ hashFiles('native/**', 'apps/desktop/scripts/linux-build-native-old-glibc.sh') }}
      - name: Build mixdog-computer, mixdog-graph, mixdog-patch (glibc 2.28)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p native-out
          docker run --rm -v "$PWD:/w" ${{ matrix.image }} bash /w/apps/desktop/scripts/linux-build-native-old-glibc.sh 2>&1 | tee native-out/build.log
          test "${PIPESTATUS[0]}" -eq 0
      - uses: actions/upload-artifact@v5
        with:
          name: native-tools-glibc228-${{ matrix.arch }}
          path: native-out/
          if-no-files-found: error

  tests:
    name: tests-${{ matrix.arch }}
    needs: native-tools
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libxtst6 libgbm1 libsecret-1-dev libx11-dev libxi-dev libxtst-dev libxcb1-dev libxkbcommon-dev libdbus-1-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('native/**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
      - uses: actions/download-artifact@v5
        with:
          name: native-tools-glibc228-${{ matrix.arch }}
          path: native-out
      - name: Select old-glibc native tools for packaging
        run: |
          chmod +x native-out/mixdog-*
          echo "MIXDOG_COMPUTER_NATIVE_BIN=$PWD/native-out/mixdog-computer" >> "$GITHUB_ENV"
          echo "MIXDOG_NATIVE_TOOLS_OVERRIDE_DIR=$PWD/native-out" >> "$GITHUB_ENV"
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/office-runtime
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - name: Build native spawn test binary
        run: npm run build:spawn:test
      - name: Root tests
        run: npm test 2>&1 | tee root-tests.log
      - name: Chromium for browser-geometry tests (no Chrome on arm64 runners)
        if: matrix.arch == 'arm64'
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          bin=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -n1)
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$bin" > "$HOME/chrome-wrapper"
          chmod +x "$HOME/chrome-wrapper"
          echo "CHROME_PATH=$HOME/chrome-wrapper" >> "$GITHUB_ENV"
      - name: Desktop tests
        run: npm test 2>&1 | tee ../../desktop-tests.log
        working-directory: apps/desktop
      - name: Desktop typecheck
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: apps/desktop
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-logs-${{ matrix.arch }}
          path: |
            root-tests.log
            desktop-tests.log
          if-no-files-found: warn

  verify:
    name: linux-${{ matrix.arch }}
    needs: [plan, native-tools]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libxtst6 libgbm1 libsecret-1-dev libx11-dev libxi-dev libxtst-dev libxcb1-dev libxkbcommon-dev libdbus-1-dev pkg-config
      - uses: actions/download-artifact@v5
        with:
          name: native-tools-glibc228-${{ matrix.arch }}
          path: native-out
      - name: Select old-glibc native tools for packaging
        run: |
          chmod +x native-out/mixdog-*
          echo "MIXDOG_COMPUTER_NATIVE_BIN=$PWD/native-out/mixdog-computer" >> "$GITHUB_ENV"
          echo "MIXDOG_NATIVE_TOOLS_OVERRIDE_DIR=$PWD/native-out" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ matrix.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - name: Build Linux package
        run: npm run build:linux -- --${{ matrix.arch }} --publish never
        working-directory: apps/desktop
      - name: Package size
        run: |
          ls -l apps/desktop/dist/*.AppImage apps/desktop/dist/*.deb
          du -sh apps/desktop/dist/linux-*unpacked || true
      - name: Record glibc floor of bundled binaries (objdump -T)
        run: |
          unpacked=$(ls -d apps/desktop/dist/linux-*unpacked | head -n1)
          node apps/desktop/scripts/linux-glibc-floor.mjs "$unpacked" 2.31 | tee glibc-floor.txt
      - name: Verify packaged node-pty (Electron ABI, real PTY spawn)
        run: |
          unpacked=$(ls -d apps/desktop/dist/linux-*unpacked | head -n1)
          ELECTRON_RUN_AS_NODE=1 "$unpacked/mixdog-desktop" apps/desktop/scripts/linux-pty-check.cjs "$PWD/$unpacked/resources" | tee pty-check.log
      - name: Verify auto-update feed and .deb metadata
        run: |
          feed=apps/desktop/dist/latest-linux.yml
          [ "${{ matrix.arch }}" = arm64 ] && feed=apps/desktop/dist/latest-linux-arm64.yml
          test -f "$feed"
          cat "$feed"
          grep -q 'AppImage' "$feed"
          # DebUpdater (selected by resources/package-type=deb) downloads the .deb named here.
          grep -Eq 'url: .*\.deb' "$feed"
          deb=$(ls apps/desktop/dist/*.deb)
          dpkg-deb -I "$deb" | tee deb-info.txt
          for dep in libsecret-tools libnotify4 libgtk-3-0 libnss3 'libasound2t64 | libasound2'; do grep -qF "$dep" deb-info.txt; done
          dpkg-deb -c "$deb" > deb-contents.txt
          grep -q 'usr/share/icons/hicolor/256x256/apps/mixdog-desktop.png' deb-contents.txt
          grep -q 'usr/share/icons/hicolor/16x16/apps/mixdog-desktop.png' deb-contents.txt
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/share/applications/mixdog-desktop.desktop | tee desktop-entry.txt
          grep -qx 'StartupWMClass=mixdog-desktop' desktop-entry.txt
      - name: Remove libfuse2 (stock Ubuntu 24.04 has none)
        run: |
          sudo apt-get remove -y 'libfuse2*' || true
          if ldconfig -p | grep -q 'libfuse.so.2'; then echo "libfuse.so.2 still present"; exit 1; fi
      - name: Headless launch smoke (AppImage, mounted, no libfuse2, --no-sandbox)
        timeout-minutes: 8
        run: |
          mkdir -p smoke
          chmod +x apps/desktop/dist/*.AppImage
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node apps/desktop/scripts/linux-launch-smoke.mjs apps/desktop/dist/mixdog-desktop-linux-*.AppImage smoke
      - name: Headless launch smoke (installed .deb, Chromium sandbox ENABLED) [full lane]
        if: needs.plan.outputs.full == 'true'
        timeout-minutes: 8
        run: |
          sudo apt-get install -y ./apps/desktop/dist/*.deb
          # The .deb postinst installs and loads the AppArmor profile (Ubuntu 24+).
          apparmor_status --enabled
          test -f /etc/apparmor.d/mixdog-desktop
          sudo cat /sys/kernel/security/apparmor/profiles | tee apparmor-profiles.txt | grep -i 'mixdog-desktop\|/opt/Mixdog'
          ls -l /opt/Mixdog/chrome-sandbox | tee sandbox-perms.txt
          grep -qx deb /opt/Mixdog/resources/package-type
          mkdir -p smoke-deb
          SMOKE_SANDBOX=1 xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node apps/desktop/scripts/linux-launch-smoke.mjs /opt/Mixdog/mixdog-desktop smoke-deb | tee smoke-deb/smoke.log
          grep -q 'sandbox: enabled' smoke-deb/smoke.log
      - name: Upload AppImage, .deb and update feed
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mixdog-linux-packages-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest-linux*.yml
          if-no-files-found: warn
      - name: Upload smoke screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-${{ matrix.arch }}
          path: |
            smoke/
            smoke-deb/
            pty-check.log
            glibc-floor.txt
            apparmor-profiles.txt
            sandbox-perms.txt
            deb-info.txt
            deb-contents.txt
            desktop-entry.txt
          if-no-files-found: warn

  # N+1: the same tree packaged with a bumped version, served as the update
  # feed in `update-path`. Packaging only; the verify job owns the test suites.
  build-next:
    name: build-next-x64
    needs: [plan, native-tools]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-x64-${{ hashFiles('apps/desktop/package-lock.json') }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libxss1 libxtst6 libgbm1 libsecret-1-dev libx11-dev libxi-dev libxtst-dev libxcb1-dev libxkbcommon-dev libdbus-1-dev pkg-config
      - uses: actions/download-artifact@v5
        with:
          name: native-tools-glibc228-x64
          path: native-out
      - name: Select old-glibc native tools for packaging
        run: |
          chmod +x native-out/mixdog-*
          echo "MIXDOG_COMPUTER_NATIVE_BIN=$PWD/native-out/mixdog-computer" >> "$GITHUB_ENV"
          echo "MIXDOG_NATIVE_TOOLS_OVERRIDE_DIR=$PWD/native-out" >> "$GITHUB_ENV"
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - name: Build N+1 Linux package (patch version bumped)
        working-directory: apps/desktop
        run: |
          next=$(node -p "const [a,b,c]=require('./package.json').version.split('.');[a,b,Number(c)+1].join('.')")
          echo "N+1 version: $next"
          npm run build:linux -- --x64 --publish never "-c.extraMetadata.version=$next"
          grep -q "^version: $next\$" dist/latest-linux.yml
          deb=$(ls dist/*.deb)
          dpkg-deb -f "$deb" Package Version | tee ../../next-deb-fields.txt
          grep -qx "Package: mixdog-desktop" ../../next-deb-fields.txt
          grep -qx "Version: $next" ../../next-deb-fields.txt
      - name: Upload N+1 packages and feed
        uses: actions/upload-artifact@v5
        with:
          name: next-linux-packages-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest-linux*.yml
          if-no-files-found: error

  # Update paths against a local HTTP feed (nothing is published): N detects,
  # downloads and sha512-verifies N+1 as an AppImage and as an installed .deb
  # (DebUpdater), and the downloaded .deb is really installed with dpkg.
  update-path:
    name: update-path-x64
    needs: [plan, verify, build-next]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v5
        with:
          name: mixdog-linux-packages-x64
          path: n
      - uses: actions/download-artifact@v5
        with:
          name: next-linux-packages-x64
          path: next
      - name: System packages (no libfuse2)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libxtst6 libgbm1
          sudo apt-get remove -y 'libfuse2*' || true
          ! ldconfig -p | grep -q 'libfuse.so.2'
      - name: Resolve versions
        run: |
          echo "NEXT_VERSION=$(sed -n 's/^version: //p' next/latest-linux.yml | head -n1)" >> "$GITHUB_ENV"
          echo "N_VERSION=$(sed -n 's/^version: //p' n/latest-linux.yml | head -n1)" >> "$GITHUB_ENV"
      - name: AppImage N updates to N+1 (AppImageUpdater, local feed)
        timeout-minutes: 8
        run: |
          test "$NEXT_VERSION" != "$N_VERSION"
          chmod +x n/*.AppImage
          mkdir -p update-out
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node apps/desktop/scripts/linux-update-smoke.mjs n/mixdog-desktop-linux-*.AppImage next "$NEXT_VERSION" AppImage update-out | tee update-out/appimage-update.log
      - name: Install N .deb and update it to N+1 (DebUpdater, sandbox enabled)
        timeout-minutes: 8
        run: |
          sudo apt-get install -y ./n/*.deb
          test "$(dpkg-query -W -f='${Version}' mixdog-desktop)" = "$N_VERSION"
          grep -qx deb /opt/Mixdog/resources/package-type
          SMOKE_SANDBOX=1 xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node apps/desktop/scripts/linux-update-smoke.mjs /opt/Mixdog/mixdog-desktop next "$NEXT_VERSION" deb update-out | tee update-out/deb-update.log
          downloaded=$(cat update-out/update-deb-downloaded.path)
          # What DebUpdater.doInstall runs (dpkg -i), with the downloaded package.
          sudo dpkg -i "$downloaded"
          test "$(dpkg-query -W -f='${Version}' mixdog-desktop)" = "$NEXT_VERSION"
          echo "dpkg upgraded mixdog-desktop $N_VERSION -> $NEXT_VERSION"
      - name: Upload update-path logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: update-path-x64
          path: update-out/
          if-no-files-found: warn

  # Distro coverage: the packages built on the Ubuntu runner, launched
  # headless in older/other distro containers (glibc baseline, non-Debian).
  container-smoke:
    name: container-${{ matrix.id }}-${{ matrix.arch }}
    needs: [plan, verify]
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: debian12, family: debian, image: "debian:12", runner: ubuntu-24.04, arch: x64, node: x64 }
          - { id: debian12, family: debian, image: "debian:12", runner: ubuntu-24.04-arm, arch: arm64, node: arm64 }
          - { id: ubuntu2204, family: debian, image: "ubuntu:22.04", runner: ubuntu-24.04, arch: x64, node: x64 }
          - { id: ubuntu2204, family: debian, image: "ubuntu:22.04", runner: ubuntu-24.04-arm, arch: arm64, node: arm64 }
          - { id: fedora, family: fedora, image: "fedora:latest", runner: ubuntu-24.04, arch: x64, node: x64 }
          - { id: fedora, family: fedora, image: "fedora:latest", runner: ubuntu-24.04-arm, arch: arm64, node: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: mixdog-linux-packages-${{ matrix.arch }}
          path: pkg
      - name: Stage Node and the smoke script's ws dependency
        run: |
          curl -fsSL "https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-${{ matrix.node }}.tar.xz" | tar -xJ
          mv node-v22.19.0-linux-${{ matrix.node }} node
          mkdir ctr
          cp apps/desktop/scripts/linux-launch-smoke.mjs ctr/
          (cd ctr && npm init -y >/dev/null && npm install --no-audit --no-fund ws@8)
          mkdir -p out
      - name: Headless smoke in ${{ matrix.image }}
        timeout-minutes: 20
        run: |
          docker run --rm --shm-size=1g -v "$PWD:/w" ${{ matrix.image }} \
            bash /w/apps/desktop/scripts/linux-container-smoke.sh ${{ matrix.family }} 2>&1 | tee out/container-smoke.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload container smoke output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: container-${{ matrix.id }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: warn