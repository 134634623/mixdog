# Mixdog iOS app: signs with the one long-lived Apple Distribution certificate
# kept in the repository secrets (.p12), fetches or creates the App Store
# profiles bound to it through the App Store Connect API key, archives, and
# uploads the build to TestFlight. Deploy calls it with every release whose
# mobile sources changed (see scripts/mobile-release.mjs); it also runs on
# mobile-v* tags and by hand.
#
# Runs never create or revoke certificates. A run warns when the certificate
# expires within 30 days and fails once it has; renew it with
# `python3 apps/mobile/scripts/ios-ci-signing.py issue` (apps/mobile/README.md).
#
# Secrets: APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER,
# IOS_DIST_P12_BASE64 (base64 .p12: certificate + private key),
# IOS_DIST_P12_PASSWORD.
# Team Q6C35DQU78, App Store Connect app 6821430566, bundle io.mixdog.app with
# the Notification Service Extension io.mixdog.app.NotificationService (created
# on first run by -allowProvisioningUpdates). See apps/mobile/README.md.

name: Mobile iOS

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version X.Y.Z (defaults to apps/mobile/package.json)"
        required: false
        type: string
      submit_review:
        description: "Submit the build to the external TestFlight group for beta review (tag runs always do)"
        required: false
        type: boolean
        default: true
      ref:
        description: "Commit to build (default: the selected branch or tag)"
        required: false
        type: string
  # Deploy's call. The mobile-v* tag Deploy's Android release creates is made
  # with the workflow token, which starts no workflow run, so the tag trigger
  # above does not upload the same version again.
  workflow_call:
    inputs:
      version:
        description: "App version X.Y.Z"
        required: true
        type: string
      ref:
        description: "Release commit SHA to build"
        required: true
        type: string
      submit_review:
        required: false
        type: boolean
        default: true
    secrets:
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      IOS_DIST_P12_BASE64:
        required: false
      IOS_DIST_P12_PASSWORD:
        required: false
      TESTFLIGHT_EXTERNAL_GROUP_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-ios-signing
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    env:
      DEVELOPMENT_TEAM: Q6C35DQU78
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Empty outside Deploy's call: the triggering tag or branch.
          ref: ${{ inputs.ref }}

      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # A called run inherits the caller's ref (a branch), so an explicit
          # version wins; a tag push carries no inputs.
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be X.Y.Z, got '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Build numbers must rise within a version across every route that
          # uploads it (Deploy, tag and manual runs number their runs
          # separately, and a job re-run keeps its run number): UTC minutes.
          echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install and check
        run: |
          npm ci
          npm run check

      - name: Sync Capacitor and install pods
        run: npm run sync:ios

      - name: App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then echo "Missing secret $name" >&2; exit 1; fi
          done
          key_dir="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$key_dir"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Distribution certificate
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          for name in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing secret $name" >&2; exit 1; fi
          done
          (umask 077; printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12")
          python3 -m pip install --quiet --break-system-packages --upgrade pyjwt "cryptography>=42"

      - name: Check distribution certificate expiry
        env:
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: python3 scripts/ios-ci-signing.py check

      - name: App Store profiles for the distribution certificate
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: python3 scripts/ios-ci-signing.py setup

      - name: Signing keychain
        env:
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Archive (Release = production APNs)
        run: |
          set -euo pipefail
          # Release signing is manual (Apple Distribution + the CI profiles).
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mixdog.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"

      - name: Export and upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.mixdog.app</key><string>Mixdog CI App Store</string>
              <key>io.mixdog.app.NotificationService</key><string>Mixdog CI NotificationService App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mixdog.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"

      - name: Submit to external TestFlight (beta app review)
        if: github.event_name != 'workflow_dispatch' || inputs.submit_review
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TESTFLIGHT_EXTERNAL_GROUP_ID: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP_ID || secrets.TESTFLIGHT_EXTERNAL_GROUP_ID }}
        run: |
          set -euo pipefail
          python3 scripts/testflight-submit.py "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"

      # Deploy does not hold the desktop release on iOS, so a failed upload or
      # submission must be impossible to miss in the run summary.
      - name: Report a failed TestFlight release
        if: failure()
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::error title=iOS TestFlight release failed::Mixdog iOS ${VERSION:-?} was not uploaded or not submitted for beta review. Desktop and Android releases are unaffected; re-run this job once the cause is fixed."
          printf '### iOS TestFlight release failed\n\nMixdog iOS %s was not uploaded or not submitted for beta review. Desktop and Android releases are unaffected; re-run this job once the cause is fixed.\n' "${VERSION:-?}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain and .p12
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/appstoreconnect"
