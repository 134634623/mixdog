# Mixdog iOS app smoke check on the iOS Simulator (an iPhone and an iPad),
# for when no real iOS device is at hand. Builds a Debug simulator app against
# a staging relay, seeds the saved PC a QR scan would store (the simulator has
# no camera), and leaves time for the desktop to approve.
# Screenshots and the app log come back as the "ios-sim" artifact.
#
# Runs only on pushes to verify/ios-sim. PAIR_LINK and RELAY_ORIGIN below are
# set per verification run; the link is a route, never a credential.

name: Mobile iOS Simulator

on:
  push:
    branches:
      - verify/ios-sim

permissions:
  contents: read

concurrency:
  group: mobile-ios-sim
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      RELAY_ORIGIN: https://192-255-139-161.sslip.io:8443
      PAIR_LINK: https://192-255-139-161.sslip.io:8443/d/fe94eef0-dbba-4b8d-a685-1c3aef6387da/
      APPROVAL_WAIT_SECONDS: "420"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install, check, sync (staging relay)
        env:
          MIXDOG_MOBILE_RELAY_ORIGIN: ${{ env.RELAY_ORIGIN }}
        run: |
          npm ci
          npm run check
          npm run sync:ios

      - name: Build for the simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tail -n 5
          echo "APP_PATH=$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" >> "$GITHUB_ENV"

      - name: Boot an iPhone and an iPad (Korean)
        run: |
          set -euo pipefail
          read -r iphone ipad < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          devices = data[runtimes[-1]]
          pick = lambda prefix: next(d["udid"] for d in reversed(devices) if d["name"].startswith(prefix))
          print(pick("iPhone"), pick("iPad"))
          ')
          echo "IPHONE=$iphone" >> "$GITHUB_ENV"
          echo "IPAD=$ipad" >> "$GITHUB_ENV"
          for udid in "$iphone" "$ipad"; do
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl spawn "$udid" defaults write 'Apple Global Domain' AppleLanguages -array ko-KR
            xcrun simctl spawn "$udid" defaults write 'Apple Global Domain' AppleLocale -string ko_KR
            xcrun simctl install "$udid" "$APP_PATH"
          done
          xcrun simctl list devices booted

      - name: Launch on the saved PC, wait for desktop approval
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots"
          shot() { xcrun simctl io "$IPHONE" screenshot "$shots/iphone-$1.png" >/dev/null 2>&1 || true
                   xcrun simctl io "$IPAD" screenshot "$shots/ipad-$1.png" >/dev/null 2>&1 || true; }
          # Seed the host book the picker writes after a QR scan (Capacitor
          # Preferences = UserDefaults "CapacitorStorage.<key>"), so the app
          # opens the PC itself at launch: no "Open in Mixdog?" system prompt.
          for udid in "$IPHONE" "$IPAD"; do
            data="$(xcrun simctl get_app_container "$udid" io.mixdog.app data)"
            mkdir -p "$data/Library/Preferences"
            PLIST="$data/Library/Preferences/io.mixdog.app.plist" python3 -c '
          import json, os, plistlib, re
          link = os.environ["PAIR_LINK"]
          device = re.search(r"/d/([^/]+)/", link).group(1)
          book = {"hosts": [{"url": link, "deviceId": device, "name": "9343 staging", "lastOpenedAt": 0}], "last": link}
          with open(os.environ["PLIST"], "wb") as f:
              plistlib.dump({"CapacitorStorage.mixdog.hosts": json.dumps(book)}, f)
          '
          done
          for name in IPHONE IPAD; do
            udid="${!name}"
            log="$shots/$(echo "$name" | tr 'A-Z' 'a-z')-console.log"
            xcrun simctl launch --stdout="$log" --stderr="$log" "$udid" io.mixdog.app
          done
          sleep 15
          shot 02-launched
          end=$(( $(date +%s) + APPROVAL_WAIT_SECONDS ))
          n=3
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 30
            shot "$(printf '%02d' "$n")-wait"
            n=$((n + 1))
          done
          # Background and foreground once: the app must come back connected.
          for udid in "$IPHONE" "$IPAD"; do xcrun simctl launch "$udid" com.apple.Preferences >/dev/null; done
          sleep 20
          for udid in "$IPHONE" "$IPAD"; do xcrun simctl launch "$udid" io.mixdog.app >/dev/null; done
          sleep 15
          shot 90-after-resume

      - name: Collect app logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          for name in IPHONE IPAD; do
            udid="${!name}"
            [ -n "$udid" ] || continue
            xcrun simctl spawn "$udid" log show --last 30m --style compact --info \
              --predicate 'processImagePath CONTAINS "App.app" OR subsystem == "io.mixdog.app"' \
              > "$RUNNER_TEMP/shots/$(echo "$name" | tr 'A-Z' 'a-z')-app.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim
          path: ${{ runner.temp }}/shots
          retention-days: 3
