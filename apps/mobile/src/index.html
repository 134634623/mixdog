<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Mixdog</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      [hidden] { display: none !important; }
      body { min-height: 100vh; display: grid; place-items: center; background: #0e0e0e; color: #e9e9e9;
        font: 400 15px/22px system-ui, -apple-system, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      main { display: grid; gap: 14px; justify-items: center; width: 100%; max-width: 344px; padding: 28px 22px;
        border-radius: 22px; background: #17171a; text-align: center; animation: rise 280ms ease-out both; }
      img { width: 54px; height: 54px; }
      h1 { font-size: 18px; line-height: 24px; font-weight: 700; }
      p { color: #a8a8a8; font-size: 13.5px; line-height: 19px; }
      ol { display: grid; gap: 7px; width: 100%; padding: 0; list-style: none; text-align: left; }
      li, .host-open { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
        background: rgba(255,255,255,.07); font-size: 13px; line-height: 18px; }
      li i { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
        background: rgba(255,255,255,.14); font-size: 11.5px; font-style: normal; font-weight: 700; }
      button { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #e9e9e9; color: #111114;
        font: 600 15px/20px system-ui, -apple-system, sans-serif; cursor: pointer; }
      button.secondary { background: transparent; color: #e9e9e9; border: 1px solid rgba(255,255,255,.18); }
      input { font: 400 14px/20px system-ui, -apple-system, sans-serif; width: 100%; padding: 12px; border-radius: 12px;
        border: 1px solid rgba(255,255,255,.18); background: transparent; color: #e9e9e9; }
      .block { display: grid; gap: 8px; width: 100%; }
      .code { text-align: center; font: 700 26px/32px ui-monospace, Consolas, monospace; letter-spacing: .3em; }
      .divider { display: flex; align-items: center; gap: 10px; width: 100%; color: #7a7a80; font-size: 12px; }
      .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.1); }
      button:disabled { opacity: .5; cursor: default; }
      .block > b { font-size: 13px; text-align: left; }
      #update-text { font-size: 13px; }
      details { width: 100%; display: grid; gap: 8px; }
      summary { color: #a8a8a8; font-size: 13px; cursor: pointer; list-style: none; }
      summary::-webkit-details-marker { display: none; }
      details[open] summary { margin-bottom: 8px; }
      details > :not(summary) { margin-bottom: 8px; }
      .host { display: flex; gap: 8px; align-items: stretch; margin-bottom: 7px; }
      .host-open { flex: 1; width: auto; min-width: 0; color: #e9e9e9; text-align: left; border: 0; cursor: pointer;
        font: 400 13px/18px system-ui, -apple-system, sans-serif; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .host-forget { width: auto; padding: 0 12px; background: transparent; color: #a8a8a8; font: 400 12px/16px system-ui, -apple-system, sans-serif; }
      #status { min-height: 19px; color: #a8a8a8; font-size: 13px; line-height: 19px; }
      #status[data-failed="1"] { color: #e5484d; }
    </style>
  </head>
  <body>
    <main>
      <img src="./mixdog.svg" alt="" draggable="false" />
      <div id="update" class="block" hidden>
        <span id="update-text"></span>
        <button id="update-get" data-t="updateGet"></button>
        <button id="update-later" class="secondary" data-t="updateLater"></button>
      </div>

      <section id="start" class="block">
        <h1 data-t="heading"></h1>
        <p data-t="note"></p>
        <ol>
          <li><i>1</i><span data-t="step1"></span></li>
          <li><i>2</i><span data-t="step2"></span></li>
          <li><i>3</i><span data-t="step3"></span></li>
        </ol>
        <button id="scan" data-t="scan"></button>
        <div class="divider" data-t="or"></div>
        <button id="enter-code" class="secondary" data-t="enterCode"></button>
      </section>

      <section id="code-entry" class="block" hidden>
        <h1 data-t="codeHeading"></h1>
        <p data-t="codeNote"></p>
        <input id="code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" maxlength="7" placeholder="000·000" data-t-aria="codeLabel" />
        <button id="connect" data-t="connect" disabled></button>
        <button id="code-back" class="secondary" data-t="back"></button>
      </section>
      <div id="hosts-section" class="block" hidden>
        <b data-t="paired"></b>
        <div id="hosts"></div>
      </div>

      <div id="status" role="status"></div>
    </main>
    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
